<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0A1B4D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Validador RYM">
  <link rel="manifest" href="/validator-tablet.webmanifest">
  <link rel="apple-touch-icon" href="/assets/rym-validator-512.png">
  <link rel="stylesheet" href="/css/validator-tablet-app.css?v=17">
  <title>Portal RYM · Validador de Unidad</title>
</head>
<body class="rym-validator-shell">
  <header class="uva-bar">
    <div class="uva-brand">
      <img src="/assets/rym-validator-512.png" alt="RYM" width="40" height="40">
      <div><b>Validador de Unidad</b><span id="subtitle">Portal RYM</span></div>
    </div>
    <div class="uva-actions">
      <span id="status" role="status">Preparando</span>
      <button id="install" type="button" hidden>Instalar app</button>
      <button id="exit" type="button">Salir</button>
    </div>
  </header>
  <main class="uva-stage">
    <div id="loading" class="uva-loading" role="status">Cargando Portal RYM…</div>
    <iframe id="portal" title="Validador de Unidad" src="/?validator-host=1"></iframe>
  </main>
  <!-- Permission: control_auto.validador_unidad_app; checked by the authenticated host. -->
  <script src="/modules/core/unit-validator-shell.js?v=17" defer></script>
</body>
</html>
