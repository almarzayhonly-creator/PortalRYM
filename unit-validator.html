          .v117-meta>span.v133-mobile-supervisor{
            grid-column:1/-1!important;width:max-content!important;max-width:100%!important;
            min-height:32px!important;padding:6px 9px!important
          }
          /* main v130/v133 use #v101CheckModal + !important; beat them explicitly here. */
          #v101CheckModal .v117-meta span.v130-mobile-owner{display:none!important}
          #v101CheckModal .v117-meta span.v133-mobile-supervisor{
            display:inline-flex!important;grid-column:1/-1!important;flex-basis:auto!important;
            width:max-content!important;max-width:100%!important;min-height:30px!important;
            padding:5px 8px!important;margin:0!important
          }
          #v101CheckModal .v117-meta span.v133-mobile-supervisor b{margin-left:3px!important}
          #v101CheckModal .v117-meta>span:not(.v133-mobile-supervisor):not(.v130-mobile-owner){
            flex-basis:auto!important;width:auto!important;max-width:100%!important
          }

          .v117-identity-line,.v117-identity-line.v125-clean{
            display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;
            gap:7px!important;margin:8px 0 10px!important;padding:0!important
          }
          .v117-identity-line>span{
            min-height:40px!important;padding:8px 10px!important;border-radius:12px!important;
            font-size:9px!important;line-height:1.2!important
          }
          .v117-identity-line>span:nth-child(2){display:none!important}
          .v117-identity-line>span:last-child{grid-column:auto!important}
          .v117-identity-line b{font-size:9px!important}

          .v133-closed-notice{margin:0 0 9px!important}

          /* Four systems become dense inspection rows instead of tall desktop cards. */
          .v117-quick-grid,.v117-quick-grid.with-gps,.v117-quick-grid.no-gps{
            display:grid!important;grid-template-columns:1fr!important;gap:8px!important;margin:0!important
          }
          .v117-status-card{
            display:grid!important;
            grid-template-columns:minmax(0,1fr)!important;
            min-height:0!important;padding:0!important;border:1px solid #D9E3EF!important;border-top-width:3px!important;
            border-radius:15px!important;background:#fff!important;box-shadow:0 5px 15px rgba(10,27,77,.045)!important;
            overflow:hidden!important
          }
          .v117-status-card header{
            min-height:62px!important;display:grid!important;grid-template-columns:36px minmax(0,1fr) 28px!important;
            align-items:center!important;gap:10px!important;padding:8px 11px!important;border:0!important
          }
          #v117GpsCard header{min-height:70px!important}
          .v117-card-icon{
            width:36px!important;height:36px!important;flex-basis:36px!important;border-radius:11px!important;
            font-size:15px!important
          }
          .v117-status-card header small{font-size:8px!important;letter-spacing:.095em!important}
          .v117-status-card header strong{font-size:13px!important;line-height:1.15!important;margin-top:2px!important}
          .v117-state-dot{
            width:28px!important;height:28px!important;border-radius:9px!important;font-size:14px!important
          }

          /* Key value is pulled into the row; secondary detail stays available without creating giant cards. */
          .v117-card-value{
            position:absolute!important;left:57px!important;right:46px!important;bottom:7px!important;
            margin:0!important;font-size:10.5px!important;line-height:1.08!important;letter-spacing:-.01em!important;
            white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important
          }
          #v117GpsCard .v117-card-value{
            bottom:7px!important;font-size:9.6px!important;white-space:normal!important;
            display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important
          }
          .v117-status-card{position:relative!important}
          .v117-card-sub,.v117-card-details{display:none!important}

          .v117-check-actions{
            position:fixed!important;left:0!important;right:0!important;bottom:0!important;z-index:100510!important;
            display:block!important;margin:0!important;padding:10px 12px calc(10px + env(safe-area-inset-bottom))!important;
            border-top:1px solid #D8E3F2!important;background:rgba(255,255,255,.96)!important;
            box-shadow:0 -10px 26px rgba(10,27,77,.08)!important;backdrop-filter:blur(12px)!important
          }
          #v101AgainCheck{
            width:100%!important;min-width:0!important;min-height:52px!important;border-radius:14px!important;
            background:#244AA5!important;border-color:#244AA5!important;color:#fff!important;font-size:13px!important;
            box-shadow:0 8px 18px rgba(36,74,165,.18)!important
          }
        }

        /* Small phones: preserve all four checks without visual crowding. */
        @media(max-width:390px){
          .v101-check-card,.v117-check-card{padding-left:9px!important;padding-right:9px!important}
          .v117-title-row h2{font-size:30px!important}
          .v117-overall{font-size:7.8px!important}
          .v117-meta{gap:5px!important}
          .v117-meta>span{font-size:7.8px!important;padding:4px 7px!important}
          .v117-identity-line>span{min-height:37px!important;padding:7px 8px!important}
          .v117-status-card header{min-height:64px!important;padding:8px 9px!important;grid-template-columns:34px minmax(0,1fr) 26px!important}
          .v117-card-icon{width:34px!important;height:34px!important}
          .v117-status-card header strong{font-size:12px!important}
          .v117-card-value{left:53px!important;right:42px!important;bottom:8px!important;font-size:10px!important}
        }

        /* Phone landscape: use two columns and keep the result above the fold. */
        @media(max-height:540px) and (orientation:landscape){
          .v101-check-card,.v117-check-card{padding:8px 10px 62px!important}
          .v117-check-head{padding-bottom:5px!important;margin-bottom:4px!important}
          .v117-title-row h2{font-size:27px!important}
          .v117-meta{display:flex!important;gap:5px!important;margin-top:4px!important}
          .v117-meta>span.v133-mobile-supervisor{grid-column:auto!important}
          .v117-identity-line,.v117-identity-line.v125-clean{margin:5px 0 6px!important}
          .v117-quick-grid,.v117-quick-grid.with-gps,.v117-quick-grid.no-gps{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important}
          .v117-status-card header{min-height:58px!important;padding:7px 9px!important}
          .v117-card-value{bottom:7px!important}
          .v117-check-actions{padding:6px 10px calc(6px + env(safe-area-inset-bottom))!important}
          #v101AgainCheck{min-height:44px!important}
        }
      `;

      function showDenied(){
        if(denied)return;denied=true;
        status.textContent='Sin acceso';status.classList.add('wait');
        frame.style.display='none';loading.classList.remove('hide');
        loading.innerHTML='<div style="width:min(620px,92vw);padding:28px;border:1px solid #d8e3f2;border-radius:24px;background:#fff;box-shadow:0 22px 70px rgba(10,27,77,.13);text-align:center"><div style="font-size:30px;margin-bottom:10px">🔒</div><b style="display:block;font-size:24px;color:#0A1B4D">Acceso restringido</b><span style="display:block;margin-top:9px;color:#62708C;line-height:1.5">Tu usuario no tiene habilitado el permiso de App Validador de Unidad.</span></div>';
      }

      function installIsolation(){
        let doc,win;
        try{doc=frame.contentDocument;win=frame.contentWindow}catch(_){return}
        if(!doc||!doc.head)return;
        const profile=(()=>{try{return win?.state?.profile||null}catch(_){return null}})();
        if(profile){
          let ok=false;
          try{ok=typeof win.rymHasModule==='function'&&win.rymHasModule(PERMISSION)}catch(_){}
          if(!ok){showDenied();return}
        }
        if(!doc.getElementById('rymUnitValidatorIsolation')){
          const style=doc.createElement('style');
          style.id='rymUnitValidatorIsolation';
          style.textContent=isolateCss;
          doc.head.appendChild(style);
        }

        const validator=doc.querySelector('.v101-validator');
        if(validator){
          if(denied)return;
          status.textContent='Listo';
          status.classList.remove('wait');
          loading.classList.add('hide');
          const q=doc.getElementById('v101ValidatorQ');
          if(q){
            q.setAttribute('inputmode','search');
            q.setAttribute('enterkeyhint','search');
            q.setAttribute('autocomplete','off');
          }
          const full=doc.getElementById('v101OpenModule');
          if(full){full.style.display='none';full.disabled=true;full.onclick=null}
          const user=doc.querySelector('.v101-top-right > div:last-child b')?.textContent?.trim();
          if(user)subtitle.textContent=user+' · Portal RYM';
        }else{
          status.textContent=doc.querySelector('.login-card,.v101-login,.login-wrap')?'Inicia sesión':'Preparando';
          status.classList.add('wait');
          loading.classList.add('hide');
        }
      }

      function watch(){
        let doc;
        try{doc=frame.contentDocument}catch(_){return}
        if(!doc)return;
        if(observer)observer.disconnect();
        observer=new MutationObserver(()=>installIsolation());
        observer.observe(doc.documentElement,{childList:true,subtree:true});
        installIsolation();
      }

      frame.addEventListener('load',()=>{
        watch();
        setTimeout(()=>{installIsolation();frame.classList.add('ready');loading.classList.add('hide')},40);
      });

      document.getElementById('exit').addEventListener('click',()=>{
        let doc;
        try{doc=frame.contentDocument}catch(_){}
        const logout=doc?.getElementById('v99Logout')||doc?.querySelector('.logout,#out');
        if(logout){logout.click();setTimeout(()=>{subtitle.textContent='Portal RYM · acceso dedicado';status.textContent='Inicia sesión';status.classList.add('wait')},40)}
        else frame.src='/?validator-host=1';
      });
    })();
  </script>
</body>
