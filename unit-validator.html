<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0A1B4D">
  <title>Portal RYM · Validador de Unidad</title>
  <style>
    :root{--navy:#0A1B4D;--blue:#244AA5;--sky:#53B7E8;--orange:#F47C20;--bg:#F4F7FB;--border:#D8E3F2;--text:#10224E;--muted:#62708C}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    body{overflow:hidden;background:radial-gradient(circle at 8% 12%,rgba(83,183,232,.11),transparent 28%),radial-gradient(circle at 92% 84%,rgba(244,124,32,.07),transparent 24%),var(--bg)}
    .bar{height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px max(20px,env(safe-area-inset-right)) 12px max(20px,env(safe-area-inset-left));background:rgba(255,255,255,.97);border-bottom:1px solid var(--border);box-shadow:0 10px 30px rgba(10,27,77,.07);position:relative;z-index:5}
    .brand{display:flex;align-items:center;gap:13px;min-width:0}
    .mark{width:48px;height:48px;border-radius:15px;background:#fff;border:1px solid #dce5f1;display:grid;place-items:center;overflow:hidden;box-shadow:0 8px 22px rgba(10,27,77,.08)}
    .mark img{width:42px;height:42px;object-fit:contain}
    .heading{min-width:0}.heading b{display:block;font-size:20px;line-height:1.05;letter-spacing:-.025em;color:var(--navy)}.heading span{display:block;margin-top:5px;font-size:11px;font-weight:800;color:var(--muted)}
    .actions{display:flex;align-items:center;gap:10px}
    .status{display:inline-flex;align-items:center;gap:7px;padding:9px 11px;border-radius:999px;background:#F0FDF4;border:1px solid #BDE6CA;color:#166534;font-size:11px;font-weight:900}
    .status:before{content:"";width:8px;height:8px;border-radius:50%;background:#22C55E}.status.wait{background:#EEF5FF;border-color:#C9DAF2;color:#244AA5}.status.wait:before{background:#53B7E8}
    .exit{min-height:46px;padding:0 16px;border:1px solid #F4C6C6;border-radius:13px;background:#FFF7F7;color:#B42318;font-size:12px;font-weight:1000;cursor:pointer}
    .stage{height:calc(100dvh - 78px);position:relative}
    iframe{width:100%;height:100%;border:0;display:block;background:transparent;opacity:0;transition:opacity .12s ease}
    iframe.ready{opacity:1}
    .loading{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--muted);font-weight:800;font-size:13px}
    .loading.hide{display:none}
    @media(max-width:650px){.bar{height:68px;padding:9px 12px}.mark{width:42px;height:42px}.mark img{width:37px;height:37px}.heading b{font-size:17px}.heading span,.status{display:none}.exit{min-height:42px;padding:0 12px}.stage{height:calc(100dvh - 68px)}}
  </style>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <div class="mark"><img src="/assets/validator-tablet-icon.svg" alt="Portal RYM"></div>
      <div class="heading"><b>Validador de Unidad</b><span id="subtitle">Portal RYM · acceso dedicado</span></div>
    </div>
    <div class="actions">
      <span class="status wait" id="status">Preparando</span>
      <button class="exit" id="exit" type="button">Salir</button>
    </div>
  </header>

  <main class="stage">
    <div class="loading" id="loading">Cargando Portal RYM…</div>
    <iframe id="portal" title="Validador de Unidad" src="/?validator-host=1"></iframe>
  </main>

  <script>
    (function(){
      const frame=document.getElementById('portal');
      const loading=document.getElementById('loading');
      const status=document.getElementById('status');
      const subtitle=document.getElementById('subtitle');
      let observer=null;

      const isolateCss=`
        html,body{background:#f4f7fb!important}
        body:has(.v101-validator) .v101-shell{display:block!important;min-height:100vh!important;width:100%!important;background:transparent!important}
        body:has(.v101-validator) .v101-side,
        body:has(.v101-validator) .v101-top,
        body:has(.v101-validator) #v115MobileNav{display:none!important}
        body:has(.v101-validator) .v101-main{width:100%!important;min-width:0!important;margin:0!important;padding:0!important;background:transparent!important}
        body:has(.v101-validator) .v101-content{width:min(1120px,100%)!important;min-height:100vh!important;margin:0 auto!important;padding:34px 26px!important;display:flex!important;align-items:center!important;justify-content:center!important;box-sizing:border-box!important}
        body:has(.v101-validator) .v101-content>*:not(.v101-validator){display:none!important}
        body:has(.v101-validator) .v101-validator{position:relative!important;width:100%!important;margin:0!important;padding:30px!important;border:1px solid #c9d9ed!important;border-radius:26px!important;background:#fff!important;box-shadow:0 28px 70px rgba(13,45,87,.13)!important;overflow:visible!important}
        body:has(.v101-validator) .v101-validator:before{content:"";position:absolute;left:28px;right:28px;top:0;height:4px;border-radius:0 0 99px 99px;background:linear-gradient(90deg,#0a1b4d,#244aa5,#53b7e8,#f47c20)}
        body:has(.v101-validator) .v101-validator-head{display:flex!important;align-items:flex-start!important;justify-content:space-between!important;gap:20px!important;margin:0 0 22px!important}
        body:has(.v101-validator) .v101-validator-head h3{margin:0!important;color:#0a1b4d!important;font-size:31px!important;line-height:1.05!important;letter-spacing:-.04em!important}
        body:has(.v101-validator) .v101-validator-head p{display:block!important;max-width:720px!important;margin:8px 0 0!important;color:#62708c!important;font-size:14px!important;line-height:1.5!important;font-weight:700!important}
        body:has(.v101-validator) .v101-validator-badge{flex:0 0 auto!important;margin:2px 0 0!important;padding:9px 12px!important;border-radius:999px!important;background:#eef5ff!important;border:1px solid #c9daf2!important;color:#244aa5!important;font-size:10px!important;font-weight:1000!important}
        body:has(.v101-validator) .v101-validator-tools{display:grid!important;grid-template-columns:minmax(0,1fr) 190px!important;gap:12px!important;align-items:stretch!important}
        body:has(.v101-validator) .v101-validator-box{position:relative!important;min-width:0!important}
        body:has(.v101-validator) .v101-validator-input{width:100%!important;height:62px!important;margin:0!important;padding:0 18px!important;border:1px solid #b9cae0!important;border-radius:17px!important;background:#fff!important;color:#10224e!important;outline:none!important;font-size:18px!important;font-weight:800!important}
        body:has(.v101-validator) .v101-validator-input:focus{border-color:#244aa5!important;box-shadow:0 0 0 4px rgba(36,74,165,.10)!important}
        body:has(.v101-validator) .v101-validator-go{width:100%!important;height:62px!important;margin:0!important;padding:0 18px!important;border:0!important;border-radius:17px!important;background:linear-gradient(180deg,#2a61bd,#174a9b)!important;color:#fff!important;box-shadow:0 10px 24px rgba(36,74,165,.20)!important;font-size:14px!important;font-weight:1000!important}
        body:has(.v101-validator) .v101-validator-note{display:flex!important;align-items:center!important;gap:8px!important;margin-top:15px!important;color:#62708c!important;font-size:12px!important;font-weight:800!important}
        body:has(.v101-validator) .v101-validator-list{top:70px!important;z-index:100400!important;max-height:340px!important;border:1px solid #cfdcee!important;border-radius:17px!important;background:#fff!important;box-shadow:0 20px 55px rgba(10,27,77,.20)!important;overflow:auto!important}
        body:has(.v101-validator) .v101-validator-item{min-height:68px!important;padding:12px 14px!important;gap:14px!important}
        body:has(.v101-validator) .v101-validator-item b{font-size:15px!important}
        body:has(.v101-validator) .v101-validator-item small{margin-top:4px!important;font-size:11px!important;line-height:1.35!important}
        #v101OpenModule{display:none!important}
        .v117-check-actions{justify-content:flex-end!important}
        .v101-check-modal,.v117-check-modal{z-index:100500!important;padding:18px!important;align-items:center!important;background:rgba(5,18,52,.62)!important;backdrop-filter:blur(7px)!important}
        .v101-check-card,.v117-check-card{width:min(1120px,96vw)!important;max-width:1120px!important;max-height:92vh!important;margin:auto!important;padding:22px!important;border-radius:25px!important;overflow:auto!important}
        @media(max-width:900px){body:has(.v101-validator) .v101-content{padding:24px 16px!important;align-items:flex-start!important}body:has(.v101-validator) .v101-validator{padding:22px!important;border-radius:22px!important}body:has(.v101-validator) .v101-validator-tools{grid-template-columns:minmax(0,1fr) 160px!important}body:has(.v101-validator) .v101-validator-input,body:has(.v101-validator) .v101-validator-go{height:58px!important}}
        @media(max-width:650px){body:has(.v101-validator) .v101-content{padding:16px 10px!important}body:has(.v101-validator) .v101-validator{padding:17px!important}body:has(.v101-validator) .v101-validator-head h3{font-size:23px!important}body:has(.v101-validator) .v101-validator-badge{display:none!important}body:has(.v101-validator) .v101-validator-tools{grid-template-columns:1fr!important}}
      `;

      function installIsolation(){
        let doc;
        try{doc=frame.contentDocument}catch(_){return}
        if(!doc||!doc.head)return;
        if(!doc.getElementById('rymUnitValidatorIsolation')){
          const style=doc.createElement('style');
          style.id='rymUnitValidatorIsolation';
          style.textContent=isolateCss;
          doc.head.appendChild(style);
        }

        const validator=doc.querySelector('.v101-validator');
        if(validator){
          status.textContent='Listo';
          status.classList.remove('wait');
          loading.classList.add('hide');
          const q=doc.getElementById('v101ValidatorQ');
          if(q){
            q.setAttribute('inputmode','search');
            q.setAttribute('enterkeyhint','search');
            q.setAttribute('autocomplete','off');
          }
          const full=doc.getElementById('v101OpenModule');
          if(full){full.style.display='none';full.disabled=true;full.onclick=null}
          const user=doc.querySelector('.v101-top-right > div:last-child b')?.textContent?.trim();
          if(user)subtitle.textContent=user+' · Portal RYM';
        }else{
          status.textContent=doc.querySelector('.login-card,.v101-login,.login-wrap')?'Inicia sesión':'Preparando';
          status.classList.add('wait');
          loading.classList.add('hide');
        }
      }

      function watch(){
        let doc;
        try{doc=frame.contentDocument}catch(_){return}
        if(!doc)return;
        if(observer)observer.disconnect();
        observer=new MutationObserver(()=>installIsolation());
        observer.observe(doc.documentElement,{childList:true,subtree:true});
        installIsolation();
      }

      frame.addEventListener('load',()=>{
        watch();
        setTimeout(()=>{installIsolation();frame.classList.add('ready');loading.classList.add('hide')},40);
      });

      document.getElementById('exit').addEventListener('click',()=>{
        let doc;
        try{doc=frame.contentDocument}catch(_){}
        const logout=doc?.getElementById('v99Logout')||doc?.querySelector('.logout,#out');
        if(logout){logout.click();setTimeout(()=>{subtitle.textContent='Portal RYM · acceso dedicado';status.textContent='Inicia sesión';status.classList.add('wait')},40)}
        else frame.src='/?validator-host=1';
      });
    })();
  </script>
</body>
</html>
