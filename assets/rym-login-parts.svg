<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="track-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#355FF5" stop-opacity=".12"/><stop offset=".52" stop-color="#355FF5"/><stop offset="1" stop-color="#355FF5" stop-opacity=".08"/></linearGradient>
    <linearGradient id="track-teal" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#00C7D4" stop-opacity=".08"/><stop offset=".5" stop-color="#00C7D4"/><stop offset="1" stop-color="#00C7D4" stop-opacity=".08"/></linearGradient>
    <linearGradient id="track-gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFD24A" stop-opacity="0"/><stop offset=".5" stop-color="#FFD24A"/><stop offset="1" stop-color="#FFD24A" stop-opacity="0"/></linearGradient>
    <pattern id="microgrid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#253B83" stroke-opacity=".065" stroke-width="1"/></pattern>
    <pattern id="service-parts" width="320" height="270" patternUnits="userSpaceOnUse">
      <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".34">
        <g stroke="#355FF5" transform="translate(52 52)">
          <circle r="25"/><circle r="17"/><circle r="4"/>
          <path d="M0-17v13m12-8-9 9m14 4H4m8 12-9-9M0 17V4m-12 8 9-9m-14-4h13m-8-12 9 9"/>
        </g>
        <g stroke="#7558F5" transform="translate(152 54)">
          <path d="M-7-25a17 17 0 0 0 19 22l23 23a8 8 0 0 1-11 11L1 8A17 17 0 0 0-21-11l11 11-9 9-11-11a17 17 0 0 0 21 22"/>
          <circle cx="30" cy="30" r="4"/>
        </g>
        <g stroke="#00AFC2" transform="translate(264 53)">
          <path d="M-10-25h20v11l-5 6v30l-5 8-5-8v-30l-5-6z"/>
          <path d="M-8-15h16m-12 0v8m8-8v8M-5 4h10m-10 8h10"/>
        </g>
        <g stroke="#00AFC2" transform="translate(80 174)">
          <path d="M-31-12h17l7-12h22l7 12h9v24h-62z"/>
          <path d="M-18-12l6-10h18l6 10M-25 4h10m23 0h10"/>
          <circle cx="-19" cy="13" r="5"/><circle cx="20" cy="13" r="5"/>
        </g>
        <g stroke="#D89B00" transform="translate(202 174)">
          <path d="M0-30l7 5 8-2 4 8-2 8 5 7-5 7 2 8-8 4-8-2-7 5-7-5-8 2-4-8 2-8-5-7 5-7-2-8 8-4 8 2z"/>
          <circle r="10"/><circle r="3"/>
        </g>
        <g stroke="#355FF5" transform="translate(278 174)">
          <path d="M-30-15h15l15-9 28 9v30L0 24l-15-9h-15z"/>
          <path d="M-22-8h14m16 0h13M-22 0h14m16 0h13M-22 8h14m16 0h13"/>
        </g>
      </g>
    </pattern>
    <filter id="node-glow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .grid{opacity:.55}
    .contour{fill:none;stroke:#355FF5;stroke-width:1.5;stroke-opacity:.13}
    .orbit{fill:none;stroke:#355FF5;stroke-opacity:.26;stroke-width:2}
    .orbit-teal{stroke:#00C7D4;stroke-opacity:.3}
    .route{fill:none;stroke-linecap:round;stroke-dasharray:5 16;animation:flow 24s linear infinite}
    .route-blue{stroke:url(#track-blue);stroke-width:3}.route-teal{stroke:url(#track-teal);stroke-width:2.5;animation-duration:31s;animation-direction:reverse}.route-gold{stroke:url(#track-gold);stroke-width:2;animation-duration:36s}
    .accent{stroke-dasharray:38 240;animation:scan 12s ease-in-out infinite}
    .accent-delay{animation-delay:-6s}
    .node{animation:beacon 4.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .node:nth-of-type(2n){animation-delay:-2.3s}
    .sweep{transform-box:fill-box;transform-origin:center;animation:sweep 28s ease-in-out infinite alternate}
    @keyframes flow{to{stroke-dashoffset:-420}}
    @keyframes scan{0%,100%{stroke-dashoffset:260;opacity:.12}50%{stroke-dashoffset:0;opacity:.7}}
    @keyframes beacon{0%,100%{opacity:.48;transform:scale(.82)}50%{opacity:1;transform:scale(1.16)}}
    @keyframes sweep{from{transform:translate3d(-.5%,.3%,0)}to{transform:translate3d(.5%,-.3%,0)}}
    @media(prefers-reduced-motion:reduce){.route,.accent,.node,.sweep{animation:none!important}}
  </style>

  <path class="grid" fill="url(#microgrid)" d="M0 0h1600v900H0z"/>
  <!-- Fine automotive service-part linework frames the login; telemetry stays in motion. -->
  <path fill="url(#service-parts)" d="M0 0h1600v900H0z"/>
  <g class="sweep">
    <!-- Topographic precision rings, cropped at the viewport edges -->
    <g class="contour">
      <path d="M-230 206C-154 64 2-26 180-33 329-39 455 36 522 153"/>
      <path d="M-196 224C-121 91 20 9 180 4c133-5 246 60 308 162"/>
      <path d="M-162 242C-88 119 39 45 180 41c118-3 218 54 275 143"/>
      <path d="M1273 955c23-157 102-277 224-344 129-70 271-60 391 23"/>
      <path d="M1308 955c22-139 92-245 201-306 114-64 241-56 349 15"/>
      <path d="M1345 955c20-120 80-212 175-268 99-58 210-51 307 8"/>
    </g>
    <g class="orbit">
      <path d="M-65 176C39 28 236-15 390 70s198 267 105 415"/>
      <path d="M1648 686c-125 137-327 163-475 59s-173-291-61-426"/>
    </g>
    <g class="orbit orbit-teal">
      <path d="M-74 228C31 80 228 36 382 122s196 269 101 417"/>
      <path d="M1665 637c-124 137-325 164-474 61s-175-289-64-425"/>
    </g>
  </g>

  <!-- Elegant telemetry lanes move behind the login panel -->
  <path class="route route-blue" d="M-45 498C113 433 222 466 350 419s220-96 345-58 193 123 326 95 213-104 353-76 187 72 281 31"/>
  <path class="route route-teal" d="M-37 537c147-65 254-28 380-68s224-95 346-52 188 123 319 92 222-102 351-70 183 79 292 36"/>
  <path class="route route-gold" d="M-20 572c133-49 222-12 341-49s225-76 338-41 191 103 316 81 211-80 333-55 193 70 312 30"/>
  <path class="route route-blue accent" d="M-45 498C113 433 222 466 350 419s220-96 345-58 193 123 326 95 213-104 353-76 187 72 281 31"/>
  <path class="route route-teal accent accent-delay" d="M-37 537c147-65 254-28 380-68s224-95 346-52 188 123 319 92 222-102 351-70 183 79 292 36"/>

  <!-- Small telemetry markers, not literal vehicle-part illustrations -->
  <g filter="url(#node-glow)">
    <circle class="node" cx="350" cy="419" r="5" fill="#fff" stroke="#355FF5" stroke-width="3"/>
    <circle class="node" cx="695" cy="361" r="4.5" fill="#fff" stroke="#00C7D4" stroke-width="3"/>
    <circle class="node" cx="1021" cy="456" r="5" fill="#fff" stroke="#FFD24A" stroke-width="3"/>
    <circle class="node" cx="1374" cy="380" r="4.5" fill="#fff" stroke="#253B83" stroke-width="3"/>
  </g>
</svg>
