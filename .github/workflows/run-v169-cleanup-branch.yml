name: Run V169 cleanup branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-v169-cleanup-branch.yml

permissions:
  contents: write

jobs:
  patch-cleanup-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup-v168
        uses: actions/checkout@v4
        with:
          ref: cleanup-v168
          fetch-depth: 0

      - name: Inject safe V169 cleanup without rewriting V168
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          data = path.read_bytes()
          tag = b'<script src="./v169-cleanup.js"></script>'
          marker = b'<head>'

          if tag not in data:
              pos = data.find(marker)
              if pos < 0:
                  raise SystemExit('ERROR: <head> not found')
              eol = b'\r\n' if b'\r\n' in data[:4096] else b'\n'
              insert_at = pos + len(marker)
              data = data[:insert_at] + eol + tag + data[insert_at:]
              path.write_bytes(data)

          if data.count(tag) != 1:
              raise SystemExit('ERROR: V169 tag count is not exactly one')
          PY

      - name: Verify existing V168 is byte-for-byte unchanged
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          original = subprocess.check_output(['git','show','HEAD:index.html'])
          current = Path('index.html').read_bytes()
          tag = b'<script src="./v169-cleanup.js"></script>'

          if current.count(tag) != 1:
              raise SystemExit('ERROR: expected one V169 tag')

          # Injector added exactly one EOL immediately before the tag.
          p = current.index(tag)
          if p >= 2 and current[p-2:p] == b'\r\n':
              cleaned = current[:p-2] + current[p+len(tag):]
          elif p >= 1 and current[p-1:p] == b'\n':
              cleaned = current[:p-1] + current[p+len(tag):]
          else:
              raise SystemExit('ERROR: V169 tag insertion format is unexpected')

          if cleaned != original:
              raise SystemExit('ERROR: existing V168 bytes changed; refusing commit')

          print('Verified: removing the one V169 tag restores the exact original index.html bytes. GPS and all V168 source are unchanged.')
          PY

      - name: Commit to cleanup-v168
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "V169 tag already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Inject V169 safe cleanup into test branch"
          git push origin HEAD:cleanup-v168
