name: Run V169 cleanup branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-v169-cleanup-branch.yml

permissions:
  contents: write

jobs:
  patch-cleanup-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup-v168
        uses: actions/checkout@v4
        with:
          ref: cleanup-v168
          fetch-depth: 0

      - name: Inject safe V169 cleanup without rewriting V168
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          data = path.read_bytes()
          tag = b'<script src="./v169-cleanup.js"></script>'
          marker = b'<head>'

          if tag not in data:
              pos = data.find(marker)
              if pos < 0:
                  raise SystemExit('ERROR: <head> not found')
              eol = b'\r\n' if b'\r\n' in data[:4096] else b'\n'
              insert_at = pos + len(marker)
              data = data[:insert_at] + eol + tag + data[insert_at:]
              path.write_bytes(data)

          if data.count(tag) != 1:
              raise SystemExit('ERROR: V169 tag count is not exactly one')
          PY

      - name: Verify only V169 tag was added
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          stat = subprocess.check_output(['git','diff','--numstat','--','index.html'], text=True).strip()
          if stat and not stat.startswith('1\t0\t'):
              raise SystemExit('ERROR: index.html changed beyond one inserted line: ' + stat)

          diff = subprocess.check_output(['git','diff','--unified=0','--','index.html'], text=True)
          added = [x for x in diff.splitlines() if x.startswith('+') and not x.startswith('+++')]
          removed = [x for x in diff.splitlines() if x.startswith('-') and not x.startswith('---')]
          if removed or (added and (len(added) != 1 or 'v169-cleanup.js' not in added[0])):
              raise SystemExit('ERROR: injector changed existing application source')

          print('Verified: exactly one script line added; existing V168 source and GPS are unchanged.')
          PY

      - name: Commit to cleanup-v168
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "V169 tag already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Inject V169 safe cleanup into test branch"
          git push origin HEAD:cleanup-v168
