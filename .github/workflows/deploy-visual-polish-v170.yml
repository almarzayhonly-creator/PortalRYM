name: Deploy visual polish V170 preview
on:
  push:
    branches: [visual-polish-v170]
    paths:
      - 'v170-visual-polish.css'
      - 'v170-visual-loader.js'
      - 'v170-control-router.js'
      - '.github/workflows/deploy-visual-polish-v170.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inject V170 preview assets into build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='<link id="rym-v170-visual-polish" rel="stylesheet" href="./v170-visual-polish.css?v=170">'
          router='<script id="rym-v170-control-router" src="./v170-control-router.js?v=170"></script>'
          assert '</head>' in s
          assert '</body>' in s
          assert 'Posiciones 4–14' in Path('panapass-v169-final.js').read_text()
          assert 'v169-rec-r2' in Path('v169-final-polish.js').read_text()
          if 'id="rym-v170-visual-polish"' not in s:
              s=s.replace('</head>', css+'\n</head>', 1)
          if 'id="rym-v170-control-router"' not in s:
              body_end=s.rfind('</body>')
              assert body_end >= 0
              s=s[:body_end]+router+'\n'+s[body_end:]
          p.write_text(s)
          final=p.read_text()
          assert final.rfind('id="rym-v170-control-router"') > final.rfind('</script>')
          assert final.rfind('id="rym-v170-control-router"') < final.rfind('</body>')
          PY
          grep -Fq 'id="rym-v170-visual-polish"' index.html
          grep -Fq 'id="rym-v170-control-router"' index.html
          grep -Fq 'Portal RYM V170 visual polish' v170-visual-polish.css
          grep -Fq 'V170 Control routing guard' v170-control-router.js
          grep -Fq 'Posiciones 4–14' panapass-v169-final.js
          grep -Fq 'v169-rec-r2' v169-final-polish.js
      - name: Deploy preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest versions upload --preview-alias visual-polish-v170 | tee wrangler-output.txt
          VURL="$(grep -oE 'https://[a-z0-9-]+-portal-ena-rym\.almarzayhonly\.workers\.dev' wrangler-output.txt | head -1)"
          echo "version_url=$VURL" >> "$GITHUB_OUTPUT"
          echo "Version URL: $VURL"
      - name: Verify exact preview version
        run: |
          U='${{ steps.deploy.outputs.version_url }}'
          test -n "$U"
          for i in 1 2 3 4 5; do
            HTML="$(curl -fsSL --max-time 20 "$U/?x=$(date +%s)" || true)"
            CSS="$(curl -fsSL --max-time 20 "$U/v170-visual-polish.css?x=$(date +%s)" || true)"
            ROUTER="$(curl -fsSL --max-time 20 "$U/v170-control-router.js?x=$(date +%s)" || true)"
            if printf '%s' "$HTML" | grep -Fq 'id="rym-v170-control-router"' && printf '%s' "$CSS" | grep -Fq 'Portal RYM V170 visual polish' && printf '%s' "$ROUTER" | grep -Fq 'V170 Control routing guard'; then
              echo "$U"
              exit 0
            fi
            sleep 5
          done
          exit 1
