name: Apply V169 podium and sidebar
on:
  push:
    branches: [cleanup-v168]
    paths:
      - '.github/workflows/v169-podium-sidebar-apply.yml'
      - '.github/scripts/apply_v169.py'
      - '.github/scripts/apply_session_guard_v169.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-v168
          fetch-depth: 0
      - name: Apply V169 ranking fixes
        run: python3 .github/scripts/apply_v169.py
      - name: Apply V169 session guard
        run: python3 .github/scripts/apply_session_guard_v169.py
      - name: Validate generated code
        run: |
          node --check panapass-v169-final.js
          grep -q 'v169-podium' panapass-v169-final.js
          grep -q 'Posiciones 4–14' panapass-v169-final.js
          grep -q 'Posiciones 15–25' panapass-v169-final.js
          grep -q 'v169-session-expiry-guard' index.html
          grep -q "loginView('Tu sesión expiró. Ingresa nuevamente.')" index.html
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add panapass-v169-final.js index.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'V169: ranking tables and safe session expiry'
            git push origin HEAD:cleanup-v168
          fi
