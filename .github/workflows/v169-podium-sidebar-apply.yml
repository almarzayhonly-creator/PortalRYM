name: Apply V169 podium and sidebar
on:
  push:
    branches: [cleanup-v168]
    paths:
      - '.github/workflows/v169-podium-sidebar-apply.yml'
      - '.github/scripts/apply_v169.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-v168
          fetch-depth: 0
      - name: Apply V169 fixes
        run: python3 .github/scripts/apply_v169.py
      - name: Validate JavaScript
        run: |
          node --check panapass-v169-final.js
          grep -q 'v169-podium' panapass-v169-final.js
          grep -q 'grid-template-columns:68px' panapass-v169-final.js
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add panapass-v169-final.js
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
          else
            git commit -m 'V169: true ranking podium and compact sidebar'
            git push origin HEAD:cleanup-v168
          fi
