name: V172 zero inline audit
on:
  push:
    branches: [v172-clean]
    paths:
      - 'tools/v172_zero_inline_audit.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v172-clean
          fetch-depth: 0
      - name: Audit remaining inline code
        run: python3 tools/v172_zero_inline_audit.py
      - name: Commit audit report
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/arquitectura/V172_ZERO_INLINE_AUDIT.json
          git commit -m 'V172 clean: record zero-inline audit'
          git push origin HEAD:v172-clean
