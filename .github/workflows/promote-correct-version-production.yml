name: Promote verified ranking recurrentes to production
on:
  push:
    branches: [test-ranking-recurrentes-correctos]
    paths: ['.github/workflows/promote-correct-version-production.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-v168
      - name: Verify approved version
        run: |
          grep -Fq 'Posiciones 4–14' panapass-v169-final.js
          grep -Fq 'Posiciones 15–25' panapass-v169-final.js
          grep -Fq 'v169-rec-r2' v169-final-polish.js
          grep -Fq 'v169r2-head' v169-final-polish.js
          grep -Fq 'Pagos recurrentes' v169-final-polish.js
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
