name: RYM portal sandbox preview

on:
  push:
    branches: [sandbox/portal-vue-next]

permissions:
  contents: read

concurrency:
  group: rym-login-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build Vue application for sandbox
        working-directory: vue-next
        run: |
          npm ci
          npm run build
          test -s dist/portal-rym-vue-next.js
          test -s dist/portal-rym-vue-next.css
          grep -Rql 'rym-vue-next-login' dist --include='*.js'
      - name: Publish isolated Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@latest versions upload --preview-alias rym-login-preview
      - name: Verify login preview
        shell: bash
        run: |
          set -euo pipefail
          url='https://rym-login-preview-portal-ena-rym.almarzayhonly.workers.dev'
          curl -fsSL --max-time 30 "$url/?preview=${GITHUB_SHA}" -o /tmp/rym-login-preview.html
          curl -fsSL --max-time 30 "$url/assets/rym-logo.png" -o /tmp/rym-logo-preview.png
          curl -fsSL --max-time 30 "$url/vue-next/dist/portal-rym-vue-next.js" -o /tmp/rym-vue-next-preview.js
          curl -fsSL --max-time 30 "$url/vue-next/dist/portal-rym-vue-next-bridge.js" -o /tmp/rym-vue-next-bridge-preview.js
          curl -fsSL --max-time 30 "$url/vue-next/dist/portal-rym-vue-next.css" -o /tmp/rym-vue-next-preview.css
          curl -fsSL --max-time 30 "$url/css/validator-tablet-app.css?preview=${GITHUB_SHA}" -o /tmp/rym-validator-html-preview.css
          for attempt in $(seq 1 6); do
            if grep -Fq 'min-height:214px!important;padding:18px!important;border-radius:16px!important' /tmp/rym-validator-html-preview.css; then break; fi
            sleep 5
            curl -fsSL --max-time 30 "$url/css/validator-tablet-app.css?preview=${GITHUB_SHA}" -o /tmp/rym-validator-html-preview.css
          done
          test -s /tmp/rym-logo-preview.png
          test -s /tmp/rym-vue-next-preview.js
          test -s /tmp/rym-vue-next-bridge-preview.js
          test -s /tmp/rym-vue-next-preview.css
          test -s /tmp/rym-validator-html-preview.css
          grep -Fq 'rym-vue-next-login' /tmp/rym-vue-next-bridge-preview.js
          grep -Fq 'rym-unit-validator-integrated #v101CheckModal' /tmp/rym-validator-html-preview.css
          grep -Fq 'body.v99-home .v101-content .v101-validator-item.v117-result-row' /tmp/rym-validator-html-preview.css
          grep -Fq 'min-height:214px!important;padding:18px!important;border-radius:16px!important' /tmp/rym-validator-html-preview.css
          grep -Fq 'Tu flota' /tmp/rym-login-preview.html
          grep -Fq 'vueNext=1' /tmp/rym-login-preview.html
          {
            echo '## RYM login sandbox preview'
            echo "URL: $url/?vueNext=1"
            echo "Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish dedicated validator preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest versions upload --preview-alias validator-tablet-app
      - name: Verify dedicated validator preview
        shell: bash
        run: |
          set -euo pipefail
          url='https://validator-tablet-app-portal-ena-rym.almarzayhonly.workers.dev'
          for attempt in $(seq 1 12); do
            if curl -fsSL -D /tmp/validator-shell.headers --max-time 20 "$url/unit-validator?preview=${GITHUB_SHA}" -o /tmp/validator-shell.html \
              && curl -fsSL --max-time 20 "$url/modules/control-auto/validator-tablet-app.js?preview=${GITHUB_SHA}" -o /tmp/validator-app.js \
              && curl -fsSL --max-time 20 "$url/vue-next/dist/portal-rym-vue-next.js?preview=${GITHUB_SHA}" -o /tmp/validator-vue.js \
              && curl -fsSL --max-time 20 "$url/vue-next/dist/portal-rym-vue-next-bridge.js?preview=${GITHUB_SHA}" -o /tmp/validator-vue-bridge.js \
              && curl -fsSL --max-time 20 "$url/vue-next/dist/portal-rym-vue-next.css?preview=${GITHUB_SHA}" -o /tmp/validator-vue.css; then
              if grep -Fq 'unit-validator-shell-v31' /tmp/validator-shell.html \
                && grep -Fiq 'x-portal-build: unit-validator-shell-v31' /tmp/validator-shell.headers \
                && grep -Fq '/css/validator-tablet-app.css?v=31' /tmp/validator-shell.html \
                && grep -Fq 'mountValidatorApp' /tmp/validator-app.js \
                && grep -Fq 'setValidatorAccess' /tmp/validator-vue.js \
                && grep -Fq 'revisados-ficha' /tmp/validator-vue-bridge.js \
                && grep -Fq '.vua-detail-toggle' /tmp/validator-vue.css; then
                echo 'Dedicated validator preview verified: $url/unit-validator'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Dedicated validator preview did not serve the new Vue resources.' >&2
          exit 1

