name: RYM login sandbox preview

on:
  push:
    branches: [sandbox/portal-vue-next]
    paths:
      - 'index.html'
      - '.github/workflows/rym-login-preview.yml'

permissions:
  contents: read

concurrency:
  group: rym-login-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Publish isolated Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@latest versions upload --preview-alias rym-login-preview
      - name: Verify login preview
        shell: bash
        run: |
          set -euo pipefail
          url='https://rym-login-preview-portal-ena-rym.almarzayhonly.workers.dev'
          curl -fsSL --max-time 30 "$url/?preview=${GITHUB_SHA}" -o /tmp/rym-login-preview.html
          curl -fsSL --max-time 30 "$url/assets/rym-logo.png" -o /tmp/rym-logo-preview.png
          test -s /tmp/rym-logo-preview.png
          grep -Fq 'Tu flota' /tmp/rym-login-preview.html
          grep -Fq 'rym-login-module-shine' /tmp/rym-login-preview.html
          {
            echo '## RYM login sandbox preview'
            echo "URL: $url/?panapassVue=1"
            echo "Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
