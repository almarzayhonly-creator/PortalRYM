name: RYM portal sandbox preview

on:
  push:
    branches: [sandbox/portal-vue-next]

permissions:
  contents: read

concurrency:
  group: rym-login-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build Vue application for sandbox
        working-directory: vue-next
        run: |
          npm ci
          npm run build
          test -s dist/portal-rym-vue-next.js
          test -s dist/portal-rym-vue-next.css
          grep -Rql 'rym-vue-next-login' dist --include='*.js'
      - name: Publish isolated Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@latest versions upload --preview-alias rym-login-preview
      - name: Publish dedicated validator preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest versions upload --preview-alias validator-tablet-app
      - name: Verify dedicated validator preview
        shell: bash
        run: |
          set -euo pipefail
          url='https://validator-tablet-app-portal-ena-rym.workers.dev'
          for attempt in $(seq 1 12); do
            if curl -fsSL -D /tmp/validator-shell.headers --max-time 20 "$url/unit-validator?preview=${GITHUB_SHA}" -o /tmp/validator-shell.html \
              && curl -fsSL --max-time 20 "$url/?validator-host=1&preview=${GITHUB_SHA}" -o /tmp/validator-host.html \
              && curl -fsSL --max-time 20 "$url/modules/control-auto/validator-tablet-app-legacy.js?preview=${GITHUB_SHA}" -o /tmp/validator-legacy.js \
              && curl -fsSL --max-time 20 "$url/css/validator-tablet-app-legacy.css?preview=${GITHUB_SHA}" -o /tmp/validator-legacy.css; then
              if grep -Fq 'unit-validator-shell-v32' /tmp/validator-shell.html \
                && grep -Fiq 'x-portal-build: unit-validator-shell-v32' /tmp/validator-shell.headers \
                && grep -Fq 'Validador de Unidad' /tmp/validator-host.html \
                && grep -Fq '/modules/control-auto/validator-tablet-app-legacy.js?v=32' /tmp/validator-host.html \
                && grep -Fq '/css/validator-tablet-app-legacy.css?v=32' /tmp/validator-host.html \
                && grep -Fq 'function ensureValidatorSurface' /tmp/validator-legacy.js \
                && grep -Fq '.v101-validator' /tmp/validator-legacy.css; then
                echo 'Dedicated legacy HTML validator preview verified: $url/unit-validator'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Dedicated legacy HTML validator resources did not become available.' >&2
          exit 1

      - name: Verify login preview
        shell: bash
        run: |
          set -euo pipefail
          url='https://rym-login-preview-portal-ena-rym.almarzayhonly.workers.dev'
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 "$url/?preview=${GITHUB_SHA}" -o /tmp/rym-login-preview.html \
              && curl -fsSL --max-time 20 "$url/assets/rym-logo.png" -o /tmp/rym-logo-preview.png \
              && curl -fsSL --max-time 20 "$url/vue-next/dist/portal-rym-vue-next.js" -o /tmp/rym-vue-next-preview.js \
              && curl -fsSL --max-time 20 "$url/vue-next/dist/portal-rym-vue-next-bridge.js" -o /tmp/rym-vue-next-bridge-preview.js \
              && curl -fsSL --max-time 20 "$url/vue-next/dist/portal-rym-vue-next.css" -o /tmp/rym-vue-next-preview.css \
              && curl -fsSL --max-time 20 "$url/css/validator-tablet-app.css?preview=${GITHUB_SHA}" -o /tmp/rym-validator-html-preview.css \
              && test -s /tmp/rym-logo-preview.png \
              && test -s /tmp/rym-vue-next-preview.js \
              && test -s /tmp/rym-vue-next-bridge-preview.js \
              && test -s /tmp/rym-vue-next-preview.css \
              && test -s /tmp/rym-validator-html-preview.css \
              && grep -Fq 'rym-vue-next-login' /tmp/rym-vue-next-bridge-preview.js \
              && grep -Fq 'rym-unit-validator-integrated #v101CheckModal' /tmp/rym-validator-html-preview.css \
              && grep -Fq 'Tu flota' /tmp/rym-login-preview.html \
              && grep -Fq 'vueNext=1' /tmp/rym-login-preview.html; then
              {
                echo '## RYM login sandbox preview'
                echo "URL: $url/?vueNext=1"
                echo "Commit: ${GITHUB_SHA}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo 'Login sandbox assets did not become available after retries.' >&2
          exit 1
