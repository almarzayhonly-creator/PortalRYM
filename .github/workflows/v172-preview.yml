name: V172 preview
on:
  push:
    branches: [v172-preview]
permissions:
  contents: read
concurrency:
  group: v172-preview
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject V171 and V172 loaders into preview build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          markers=[
            '<script id="rym-v171-loader" src="/modules/v171-loader.js?v=171"></script>\n',
            '<script id="rym-v172-fixes" src="/modules/v172-fixes.js?v=172"></script>\n',
            '<script id="rym-v172-ecar-status" src="/modules/v172-ecarcheck-status.js?v=172"></script>\n'
          ]
          m=re.search(r'<head\b[^>]*>', s, re.I)
          if not m: raise SystemExit('head start not found')
          insert=''.join(x for x in markers if x.split(' id="')[1].split('"')[0] not in s)
          if insert:
              s=s[:m.end()]+'\n'+insert+s[m.end():]
              p.write_text(s)
          head=p.read_text()[:16000]
          for marker in ('rym-v171-loader','rym-v172-fixes','rym-v172-ecar-status'):
              if marker not in head: raise SystemExit(marker+' not injected')
          PY
      - name: Deploy isolated preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest versions upload --preview-alias v172-preview 2>&1 | tee /tmp/wrangler.out
          U=$(grep -Eo 'https://[a-f0-9-]+-portal-ena-rym\.almarzayhonly\.workers\.dev' /tmp/wrangler.out | head -1)
          test -n "$U"
          echo "url=$U" >> "$GITHUB_OUTPUT"
          echo "Exact preview: $U"
      - name: Verify recovered preview assets
        env:
          QA_URL: ${{ steps.deploy.outputs.url }}
        run: |
          U="$QA_URL"
          test -n "$U"
          curl -fsSL --max-time 20 "$U/?v172=$(date +%s)" -o /tmp/index.html
          curl -fsSL --max-time 20 "$U/modules/v171-loader.js?v=172" -o /tmp/v171.js
          curl -fsSL --max-time 20 "$U/modules/panapass/ranking/index.js?v=172" -o /tmp/ranking.js
          curl -fsSL --max-time 20 "$U/modules/panapass/recurrentes/index.js?v=172" -o /tmp/recurrentes.js
          curl -fsSL --max-time 20 "$U/modules/v172-fixes.js?v=172" -o /tmp/v172.js
          grep -Fq 'rym-v171-loader' /tmp/index.html
          grep -Fq 'rym-v172-fixes' /tmp/index.html
          grep -Fq 'RYM_PANAPASS_RANKING' /tmp/ranking.js
          grep -Fq 'RYM_PANAPASS_RECURRENTES' /tmp/recurrentes.js
          grep -Fq 'pending_cobra' /tmp/v172.js || grep -Fq 'pendiente_cobra' /tmp/v172.js
