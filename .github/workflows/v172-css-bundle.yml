name: V172 canonical CSS bundle
on:
  push:
    branches: [v172-clean]
    paths:
      - 'tools/v172_bundle_css.py'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v172-clean
          fetch-depth: 0
      - name: Build canonical CSS in exact cascade order
        run: python3 tools/v172_bundle_css.py
      - name: Validate CSS ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          links=re.findall(r'<link\b[^>]*rel=["\']stylesheet["\'][^>]*>',s,re.I)
          assert len(links)==1, len(links)
          assert '/css/portal-rym.css' in links[0]
          assert '<style' not in s.lower()
          assert Path('css/portal-rym.css').stat().st_size>0
          assert 'const css=[];' in Path('modules/v172-clean-loader.js').read_text()
          print('css ownership ok')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html modules/v172-clean-loader.js css/portal-rym.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V172 clean: bundle CSS into canonical stylesheet'
          git push origin HEAD:v172-clean
