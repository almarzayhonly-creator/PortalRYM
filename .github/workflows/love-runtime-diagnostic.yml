name: Love runtime diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/love-runtime-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Probe mobile production runtime
        run: |
          cat > love-diag.mjs <<'JS'
          import { chromium } from 'playwright';
          const url='https://portal-ena-rym.almarzayhonly.workers.dev/?mobile_love_diag='+Date.now();
          const b=await chromium.launch({headless:true});
          const c=await b.newContext({
            viewport:{width:390,height:844},
            isMobile:true,
            hasTouch:true,
            deviceScaleFactor:3,
            userAgent:'Mozilla/5.0 (Linux; Android 16; SM-A556E) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36'
          });
          const p=await c.newPage();
          const errors=[]; p.on('pageerror',e=>errors.push(String(e)));
          await p.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
          await p.waitForTimeout(2500);
          const before=await p.evaluate(()=>({
            inline:!!document.querySelector('#rym-aracelys-messages-inline'),
            flag:window.__RYM_ARACELYS_MESSAGES__===true,
            stateType:typeof state,
            viewport:[innerWidth,innerHeight],
            ready:document.readyState
          }));
          const fake=await p.evaluate(async()=>{
            if(typeof state==='undefined') return {set:false};
            state.profile={id:'mobile-test',usuario:'Yhonly',nombre:'Yhonly Almarza',rol:'ADMIN_TOTAL'};
            await new Promise(r=>setTimeout(r,1400));
            const el=document.querySelector('#rymLoveFab');
            const cs=el?getComputedStyle(el):null;
            const r=el?.getBoundingClientRect();
            return {set:true,exists:!!el,text:el?.textContent||'',display:cs?.display||'',visibility:cs?.visibility||'',opacity:cs?.opacity||'',zIndex:cs?.zIndex||'',rect:r?{x:r.x,y:r.y,width:r.width,height:r.height,bottom:r.bottom,right:r.right}:null,inViewport:r? r.left>=0&&r.top>=0&&r.right<=innerWidth&&r.bottom<=innerHeight:false};
          });
          console.log('MOBILE_LOVE_DIAG '+JSON.stringify({url,before,fake,errors}));
          await c.close(); await b.close();
          if(!before.inline || !before.flag || before.stateType==='undefined' || !fake.exists || !fake.inViewport || fake.display==='none' || fake.visibility==='hidden' || fake.opacity==='0') process.exit(2);
          JS
          node love-diag.mjs
