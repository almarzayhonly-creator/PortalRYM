name: V172 clean Panapass extraction
on:
  push:
    branches: [v172-clean]
    paths:
      - 'tools/v172_extract_panapass.py'
permissions:
  contents: write
concurrency:
  group: v172-clean-panapass-extract
  cancel-in-progress: true
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v172-clean
          fetch-depth: 0
      - name: Extract base runtime and CSS from monolith
        run: python3 tools/v172_extract_panapass.py
      - name: Validate extracted runtime
        run: |
          node --check modules/core/runtime.js
          test -s css/core-base.css
          grep -Fq '/css/core-base.css' index.html
          grep -Fq '/modules/core/runtime.js' index.html
          ! grep -Fq "const URL='https://avczyvcpmicpuhdkmxzx.supabase.co'" index.html
          ! grep -Fq ':root{font-family:"Segoe UI",Arial,sans-serif' index.html
          grep -Fq 'async function dashboard' modules/core/runtime.js
          grep -Fq 'async function negativos' modules/core/runtime.js
          grep -Fq 'async function pagosTrabajo' modules/core/runtime.js
          grep -Fq 'async function historial' modules/core/runtime.js
          grep -Fq 'async function operaciones' modules/core/runtime.js
          grep -Fq 'async function reportes' modules/core/runtime.js
      - name: Validate clean modular layer
        run: |
          node --check modules/panapass/router.js
          node --check modules/panapass/ranking/index.js
          node --check modules/panapass/recurrentes/index.js
          node --check modules/v172-clean-loader.js
          grep -Fq '/modules/panapass/router.js' modules/v172-clean-loader.js
          grep -Fq '/modules/panapass/ranking/index.js' modules/v172-clean-loader.js
          grep -Fq '/modules/panapass/recurrentes/index.js' modules/v172-clean-loader.js
      - name: Commit extracted base runtime
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html modules css qa tools
          git commit -m 'V172 clean: move base runtime and CSS out of index'
          git push origin HEAD:v172-clean
