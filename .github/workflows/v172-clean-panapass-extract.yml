name: V172 clean Panapass extraction
on:
  push:
    branches: [v172-clean]
    paths:
      - 'tools/v172_extract_panapass.py'
permissions:
  contents: write
concurrency:
  group: v172-clean-panapass-extract
  cancel-in-progress: true
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v172-clean
          fetch-depth: 0
      - name: Extract Panapass from shared runtime
        run: python3 tools/v172_extract_panapass.py
      - name: Validate JavaScript syntax
        run: |
          node --check modules/core/runtime.js
          node --check modules/panapass/dashboard/base.js
          node --check modules/panapass/negativos/base.js
          node --check modules/panapass/pagos/consulta.js
          node --check modules/panapass/pagos/trabajo.js
          node --check modules/panapass/historial/base.js
          node --check modules/panapass/operaciones/base.js
          node --check modules/panapass/reportes/base.js
          node --check modules/panapass/perfil-supervisora.js
          node --check modules/panapass/router.js
          node --check modules/panapass/ranking/index.js
          node --check modules/panapass/recurrentes/index.js
          node --check modules/v172-clean-loader.js
      - name: Validate source separation
        run: |
          test -s css/core-base.css
          grep -Fq '/css/core-base.css' index.html
          grep -Fq '/modules/core/runtime.js' index.html
          for f in \
            /modules/panapass/dashboard/base.js \
            /modules/panapass/negativos/base.js \
            /modules/panapass/pagos/consulta.js \
            /modules/panapass/pagos/trabajo.js \
            /modules/panapass/historial/base.js \
            /modules/panapass/operaciones/base.js \
            /modules/panapass/reportes/base.js \
            /modules/panapass/perfil-supervisora.js; do
            grep -Fq "$f" index.html
          done
          ! grep -Eq '^[[:space:]]*async function (dashboard|negativos|pagosConsultaHoy|pagosTrabajo|historial|operaciones|reportes|openSupervisoraProfile)\(' modules/core/runtime.js
          grep -Fq '/modules/panapass/router.js' modules/v172-clean-loader.js
          grep -Fq '/modules/panapass/ranking/index.js' modules/v172-clean-loader.js
          grep -Fq '/modules/panapass/recurrentes/index.js' modules/v172-clean-loader.js
      - name: Commit extracted Panapass views
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html modules css qa tools
          git commit -m 'V172 clean: split Panapass base views from runtime'
          git push origin HEAD:v172-clean
