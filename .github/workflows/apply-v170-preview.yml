name: Apply and deploy V170 preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v170-preview.yml

permissions:
  contents: write

jobs:
  apply-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out cleanup-v168
        uses: actions/checkout@v4
        with:
          ref: cleanup-v168
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Add V170 visual stability layer
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > v170-stability-visual.js
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script src="./v169-final-polish.js?v=169final" defer></script>'
          addition = marker + '\n<script src="./v170-stability-visual.js?v=170" defer></script>'
          if '<script src="./v170-stability-visual.js?v=170" defer></script>' not in text:
              if marker not in text:
                  raise SystemExit('V169 marker not found in index.html')
              path.write_text(text.replace(marker, addition, 1), encoding='utf-8')
          PY

      - name: Verify preserved and new code
        shell: bash
        run: |
          node --check v170-stability-visual.js
          grep -Fq 'v170-stability-visual.js?v=170' index.html
          grep -Fq 'Posiciones 4–14' panapass-v169-final.js
          grep -Fq 'Posiciones 15–25' panapass-v169-final.js
          grep -Fq 'v169-rec-r2' v169-final-polish.js
          grep -Fq 'panapass-baja-transferencia-pdf-v2' v169-final-polish.js
          grep -Fq '__RYM_V170_STABILITY__' v170-stability-visual.js
          grep -Fq 'Regla temporal confirmada' v170-stability-visual.js

      - name: Commit V170 to cleanup-v168
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html v170-stability-visual.js
          if ! git diff --cached --quiet; then
            git commit -m 'Add V170 stability, freshness and mobile usability fixes'
            git push origin HEAD:cleanup-v168
          fi

      - name: Deploy Cloudflare preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest versions upload --preview-alias cleanup-v168

      - name: Verify live preview
        shell: bash
        run: |
          base='https://cleanup-v168-portal-ena-rym.almarzayhonly.workers.dev'
          ready=0
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error "$base/" --output /tmp/portal-index.html
            if grep -Fq 'v170-stability-visual.js?v=170' /tmp/portal-index.html; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1
          curl --fail --silent --show-error "$base/v170-stability-visual.js?v=170" --output /tmp/v170.js
          curl --fail --silent --show-error "$base/panapass-v169-final.js?v=169final" --output /tmp/panapass-v169.js
          curl --fail --silent --show-error "$base/v169-final-polish.js?v=169final" --output /tmp/v169-polish.js
          grep -Fq '__RYM_V170_STABILITY__' /tmp/v170.js
          grep -Fq 'Regla temporal confirmada' /tmp/v170.js
          grep -Fq 'Posiciones 4–14' /tmp/panapass-v169.js
          grep -Fq 'Posiciones 15–25' /tmp/panapass-v169.js
          grep -Fq 'v169-rec-r2' /tmp/v169-polish.js
          grep -Fq 'panapass-baja-transferencia-pdf-v2' /tmp/v169-polish.js
