name: V169 authenticated audit retry

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v169-auth-retry.yml']

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-v168

      - name: Create temporary audit user
        shell: bash
        run: |
          mkdir -p audit
          OIDC=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=portal-rym-v169-audit" | jq -r .value)
          R=$(curl -fsSL -X POST 'https://avczyvcpmicpuhdkmxzx.supabase.co/functions/v1/rym-audit-bootstrap' -H "Authorization: Bearer $OIDC" -H 'Content-Type: application/json' --data '{"action":"create"}')
          test "$(jq -r .ok <<<"$R")" = true
          ID=$(jq -r .id <<<"$R"); U=$(jq -r .usuario <<<"$R"); P=$(jq -r .password <<<"$R")
          echo "::add-mask::$U"; echo "::add-mask::$P"
          echo "AUDIT_USER_ID=$ID" >> "$GITHUB_ENV"
          echo "AUDIT_USERNAME=$U" >> "$GITHUB_ENV"
          echo "AUDIT_PASSWORD=$P" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Audit authenticated modules
        env:
          AUDIT_USERNAME: ${{ env.AUDIT_USERNAME }}
          AUDIT_PASSWORD: ${{ env.AUDIT_PASSWORD }}
        run: |
          cat > audit/run.mjs <<'JS'
          import {chromium} from 'playwright'; import fs from 'node:fs';
          const base='https://cleanup-v168-portal-ena-rym.almarzayhonly.workers.dev';
          const mods=[['Revisados','v60OpenRevisados','v66-revisados'],['Control de Auto','v70OpenControl','v70-control'],['Usuarios','v70OpenUsers','v70-admin'],['GPS','v113OpenGps','v157-gps']];
          const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:1440,height:900}}),p=await c.newPage();
          const ce=[],pe=[],rf=[]; p.on('console',m=>m.type()==='error'&&ce.push(m.text()));p.on('pageerror',e=>pe.push(String(e)));p.on('requestfailed',r=>rf.push(r.url()));
          const visible=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
          async function inspect(){return await p.evaluate(()=>{const vis=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};const clip=[...document.querySelectorAll('button,a,span,p,h1,h2,h3,h4,th,td,label')].filter(vis).filter(e=>{const s=getComputedStyle(e);return (s.overflow==='hidden'||s.textOverflow==='ellipsis')&&(e.scrollWidth>e.clientWidth+4||e.scrollHeight>e.clientHeight+4)}).slice(0,20).map(e=>(e.innerText||e.textContent||'').replace(/\s+/g,' ').trim().slice(0,80));const t=new Map();[...document.querySelectorAll('article,.card,.kpi,.v99-alert,.v99-priority,.v100-priority')].filter(vis).forEach(e=>{const x=(e.innerText||'').replace(/\s+/g,' ').trim().toUpperCase();if(x.length>18)t.set(x,(t.get(x)||0)+1)});return{bodyClass:document.body.className,overflow:document.documentElement.scrollWidth>innerWidth+2,clipped:clip,duplicates:[...t].filter(x=>x[1]>1).slice(0,15),text:(document.body.innerText||'').replace(/\s+/g,' ').slice(0,1200)}})}
          await p.goto(base,{waitUntil:'networkidle',timeout:45000}); await p.locator('input[name=usuario]').fill(process.env.AUDIT_USERNAME);await p.locator('input[name=password]').fill(process.env.AUDIT_PASSWORD);await p.locator('button[type=submit],#loginBtn').first().click();
          await p.waitForFunction(()=>!document.querySelector('main.login'),null,{timeout:30000}); await p.waitForTimeout(2500);
          const out={login:true,homeDesktop:await inspect(),homeMobile:null,modules:[],consoleErrors:ce,pageErrors:pe,failedRequests:rf};await p.screenshot({path:'audit/home-desktop.png',fullPage:true});await p.setViewportSize({width:390,height:844});await p.waitForTimeout(500);out.homeMobile=await inspect();await p.screenshot({path:'audit/home-mobile.png',fullPage:true});
          for(const [name,fn,cls] of mods){await p.setViewportSize({width:1440,height:900});const before=[ce.length,pe.length,rf.length],t=Date.now();let err=null;try{await p.evaluate(async f=>{if(typeof window[f]!=='function')throw new Error(f+' unavailable');await window[f]()},fn);await p.waitForFunction(x=>document.body.classList.contains(x),cls,{timeout:25000});await p.waitForTimeout(3000)}catch(e){err=String(e)}const d=await inspect();await p.screenshot({path:`audit/${name.replaceAll(' ','-')}-desktop.png`,fullPage:true});await p.setViewportSize({width:390,height:844});await p.waitForTimeout(600);const m=await inspect();await p.screenshot({path:`audit/${name.replaceAll(' ','-')}-mobile.png`,fullPage:true});out.modules.push({name,ms:Date.now()-t,error:err,desktop:d,mobile:m,consoleErrors:ce.slice(before[0]),pageErrors:pe.slice(before[1]),failedRequests:rf.slice(before[2])});try{await p.evaluate(async()=>{if(typeof window.v36PortalHome==='function')await window.v36PortalHome()});await p.waitForTimeout(1000)}catch{}}
          fs.writeFileSync('audit/report.json',JSON.stringify(out,null,2));console.log('V169_AUTH_RESULT '+JSON.stringify({home:{d:out.homeDesktop.bodyClass,m:out.homeMobile.bodyClass},modules:out.modules.map(x=>({name:x.name,error:x.error,ms:x.ms,dc:x.desktop.bodyClass,mc:x.mobile.bodyClass,do:x.desktop.overflow,mo:x.mobile.overflow,clipped:x.desktop.clipped.length+'/'+x.mobile.clipped.length,dupes:x.desktop.duplicates.length+'/'+x.mobile.duplicates.length,ce:x.consoleErrors.length,pe:x.pageErrors.length,rf:x.failedRequests.length}))}));await c.close();await b.close();
          JS
          node audit/run.mjs

      - name: Delete temporary audit user
        if: always() && env.AUDIT_USER_ID != ''
        shell: bash
        run: |
          OIDC=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=portal-rym-v169-audit" | jq -r .value)
          curl -fsSL -X POST 'https://avczyvcpmicpuhdkmxzx.supabase.co/functions/v1/rym-audit-bootstrap' -H "Authorization: Bearer $OIDC" -H 'Content-Type: application/json' --data "{\"action\":\"delete\",\"id\":\"$AUDIT_USER_ID\"}" | jq -c .

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v169-auth-retry
          path: audit/
          retention-days: 3
