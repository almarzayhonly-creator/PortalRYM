name: Inspect Control de Auto handlers
on:
  push:
    branches: [visual-polish-v170]
    paths:
      - '.github/workflows/inspect-control-functions.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Audit and Validator implementation contexts
        run: |
          python3 - <<'PY' > control-functions.txt
          from pathlib import Path
          import re
          s=Path('index.html').read_text(errors='ignore')
          targets=[
            'v75ControlAudit','v80OpenEcarValidator','v75ControlUnits',
            'window.v75ControlAudit','window.v80OpenEcarValidator','window.v75ControlUnits',
            'ca6Audit','v112-audit-master','ca6Out','section-tools'
          ]
          for t in targets:
            print('\n===== '+t+' =====')
            hits=[m.start() for m in re.finditer(re.escape(t),s)]
            print('hits',hits[:50])
            for i in hits[:20]:
              print(f'--- context @{i} ---')
              print(s[max(0,i-6000):min(len(s),i+18000)])
          print('\n===== explicit Units awaits/calls =====')
          for m in re.finditer(r'(?:await\s+)?(?:window\.)?v75ControlUnits\s*\([^)]*\)',s):
            i=m.start()
            print(f'--- call @{i}: {m.group(0)} ---')
            print(s[max(0,i-7000):min(len(s),i+14000)])
          PY
          wc -c control-functions.txt
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-functions
          path: control-functions.txt
          retention-days: 2
