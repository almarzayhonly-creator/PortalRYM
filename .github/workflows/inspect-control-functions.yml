name: Inspect Control de Auto handlers
on:
  push:
    branches: [visual-polish-v170]
    paths:
      - '.github/workflows/inspect-control-functions.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect direct Audit and Validator renderers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(errors='ignore')
          targets=['ca6Audit','renderPanel','v112-audit-master','ca6Out','section-tools']
          for t in targets:
            print('\n===== '+t+' =====')
            hits=[m.start() for m in re.finditer(re.escape(t),s)]
            print('hits',hits[:30])
            for i in hits[:12]:
              print(f'--- context @{i} ---')
              print(s[max(0,i-3000):min(len(s),i+7000)])
          PY
