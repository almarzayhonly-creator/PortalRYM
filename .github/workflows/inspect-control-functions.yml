name: Inspect Control de Auto handlers
on:
  push:
    branches: [visual-polish-v170]
    paths:
      - '.github/workflows/inspect-control-functions.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact Control handler definitions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(errors='ignore')
          names=['v70OpenControl','v75ControlUnits','v75ControlAudit','v75ControlDashboard','v94ControlCuposATTT','v80OpenEcarValidator']
          for name in names:
            print('\n===== '+name+' =====')
            patterns=[
              rf'async\s+function\s+{re.escape(name)}\s*\(',
              rf'function\s+{re.escape(name)}\s*\(',
              rf'(?:window\.)?{re.escape(name)}\s*=\s*async\s*function\s*\(',
              rf'(?:window\.)?{re.escape(name)}\s*=\s*function\s*\(',
              rf'(?:window\.)?{re.escape(name)}\s*=\s*async\s*\(',
              rf'(?:window\.)?{re.escape(name)}\s*=\s*\('
            ]
            hits=[]
            for pat in patterns:
              for m in re.finditer(pat,s): hits.append(m.start())
            hits=sorted(set(hits))
            print('definition_hits',hits)
            if not hits:
              poss=[m.start() for m in re.finditer(re.escape(name),s)]
              print('all_occurrences',poss[:20])
              for i in poss[:4]: print('--- context ---\n'+s[max(0,i-1200):min(len(s),i+5000)])
              continue
            for i in hits[:4]:
              print(f'--- definition at {i} ---')
              print(s[i:min(len(s),i+18000)])
          PY
