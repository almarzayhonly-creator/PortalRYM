name: Stitch generate Operations emitted today

on:
  workflow_dispatch:
  push:
    branches: [sandbox/panapass-v2]
    paths:
      - 'tools/stitch/stitch-operations-emitted.mjs'
      - 'tools/stitch/package.json'
      - '.github/workflows/stitch-generate-operations-emitted.yml'

permissions:
  contents: write

concurrency:
  group: stitch-operations-emitted-${{ github.sha }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sandbox/panapass-v2
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Stitch SDK
        working-directory: tools/stitch
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Generate Stitch proposal for Operations emitted today
        working-directory: tools/stitch
        env:
          STITCH_API_KEY: ${{ secrets.STITCH_API_KEY }}
          STITCH_PROJECT_ID: ${{ vars.STITCH_PROJECT_ID }}
        run: npm run stitch:operations-emitted

      - name: Commit generated Stitch proposal
        run: |
          if git diff --quiet -- .stitch/generated && [ -z "$(git status --porcelain .stitch/generated)" ]; then
            echo "No generated Stitch changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .stitch/generated
          git commit -m "chore(stitch): generate Operations emitted-today proposal"
          git push origin HEAD:sandbox/panapass-v2
