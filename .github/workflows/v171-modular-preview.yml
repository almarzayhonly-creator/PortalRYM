name: V171 modular preview
on:
  push:
    branches: [v171-modular]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inventory Panapass monolith
        run: node qa/v171-panapass-inventory.js
      - name: Inject V171 loader into preview build only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          marker='<script id="rym-v171-loader" src="/modules/v171-loader.js?v=171"></script>\n'
          if 'id="rym-v171-loader"' not in s:
              low=s.lower()
              i=low.find('</head>')
              if i < 0: raise SystemExit('head end not found')
              p.write_text(s[:i]+marker+s[i:])
          PY
          grep -Fq 'rym-v171-loader' index.html
      - name: Deploy isolated preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest versions upload --preview-alias v171-modular
      - name: Verify modular assets
        run: |
          U='https://v171-modular-portal-ena-rym.almarzayhonly.workers.dev'
          for i in 1 2 3 4 5; do
            ok=1
            curl -fsSL --max-time 20 "$U/?x=$(date +%s)" -o /tmp/i || ok=0
            curl -fsSL --max-time 20 "$U/modules/v171-loader.js?x=$(date +%s)" -o /tmp/l || ok=0
            for f in core panapass revisados control-auto gps usuarios; do curl -fsSL --max-time 20 "$U/css/$f.css?x=$(date +%s)" -o "/tmp/$f.css" || ok=0; done
            if [ "$ok" = 1 ] && grep -Fq 'rym-v171-loader' /tmp/i && grep -Fq 'RYM_V171_READY' /tmp/l && grep -Fq -- '--rym-panapass' /tmp/core.css; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Install Playwright
        run: npm install playwright && npx playwright install --with-deps chromium
      - name: Module smoke test
        env:
          QA_URL: https://v171-modular-portal-ena-rym.almarzayhonly.workers.dev
        run: node qa/v171-module-smoke.js
