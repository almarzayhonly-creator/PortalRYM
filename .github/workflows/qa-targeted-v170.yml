name: QA targeted V170 navigation
on:
  push:
    branches: [visual-polish-v170]
    paths:
      - 'qa/v170-targeted-nav.js'
      - '.github/workflows/qa-targeted-v170.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Diagnose navigation
        env:
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          QA_URL: https://59da4aea-portal-ena-rym.almarzayhonly.workers.dev
        run: node qa/v170-targeted-nav.js
      - name: Upload targeted results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v170-targeted-nav-results
          path: qa-targeted-results/
          if-no-files-found: warn
          retention-days: 7
