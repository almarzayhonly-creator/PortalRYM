name: Inspect Panapass PDF wiring
on:
  push:
    branches: [cleanup-v168]
    paths: ['.github/workflows/v169-pdf-wire-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find PDF wiring
        shell: bash
        run: |
          echo '--- matches ---'
          grep -n -i -E 'Formulario firmado|panapass-baja-transferencia-pdf|transferencia.?de.?saldo|baja.?transfer|generar.?formulario|formulario.?firmado' index.html | head -80 || true
          echo '--- contexts ---'
          for n in $(grep -n -i -E 'Formulario firmado|panapass-baja-transferencia-pdf|transferencia.?de.?saldo|generar.?formulario' index.html | cut -d: -f1 | head -20); do
            s=$((n>8?n-8:1)); e=$((n+18)); echo "### lines $s-$e"; sed -n "${s},${e}p" index.html; done
