name: Inspect Panapass PDF wiring
on:
  push:
    branches: [cleanup-v168]
    paths: ['.github/workflows/v169-pdf-wire-inspect.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-v168
          fetch-depth: 0
      - name: Build PDF wiring report
        shell: bash
        run: |
          mkdir -p audit
          : > audit/v169-pdf-wiring.txt
          echo '--- matches ---' >> audit/v169-pdf-wiring.txt
          grep -n -i -E 'Formulario firmado|panapass-baja-transferencia-pdf|transferencia.?de.?saldo|baja.?transfer|generar.?formulario|formulario.?firmado|certificado|pdf-lib|PDFDocument|download' index.html | head -160 >> audit/v169-pdf-wiring.txt || true
          echo '--- contexts ---' >> audit/v169-pdf-wiring.txt
          for n in $(grep -n -i -E 'Formulario firmado|panapass-baja-transferencia-pdf|transferencia.?de.?saldo|generar.?formulario|certificado|PDFDocument' index.html | cut -d: -f1 | head -30); do
            s=$((n>12?n-12:1)); e=$((n+30)); echo "### lines $s-$e" >> audit/v169-pdf-wiring.txt; sed -n "${s},${e}p" index.html >> audit/v169-pdf-wiring.txt; done
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/v169-pdf-wiring.txt
          git commit -m 'Audit V169 ENA PDF wiring' || exit 0
          git push origin HEAD:cleanup-v168
