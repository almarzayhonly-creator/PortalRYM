name: Architecture V2 contracts

on:
  push:
    branches: [architecture-v2-panapass-pilot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify JavaScript syntax
        run: |
          node --check modules/core/event-bus.js
          node --check modules/core/context.js
          node --check modules/core/dashboard-payments-enhance.js
          node --check modules/core/panapass-negativos-panama-date.js
          node --check modules/panapass/index.js
          node --check modules/panapass/ranking/index.js
          node --check modules/panapass/recurrentes/index.js
          node --check modules/panapass/bajas/index.js
          node --check modules/panapass/pagos/index.js
          node --check modules/panapass/negativos/index.js
          node --check modules/panapass/negativos/panama-date.js
          node --check modules/panapass/dashboard/index.js
          node --check modules/v171-loader.js
      - name: Verify architecture contracts
        run: node qa/architecture-v2-contracts.mjs
      - name: Verify Panapass ranking behavior
        run: node qa/v171-ranking-contract.js
      - name: Verify Panapass recurrentes behavior
        run: node qa/v171-recurrentes-contract.js
      - name: Verify Panapass bajas behavior
        run: node qa/v171-bajas-contract.js
      - name: Verify Panapass pagos behavior
        run: node qa/v172-pagos-contract.js
      - name: Verify Panapass negativos behavior
        run: node qa/v172-negativos-contract.js
