name: Architecture V2 preview


on:
  push:
    branches: [architecture-v2-panapass-pilot, architecture-v2-panapass-recovery-3ff12a1]
  workflow_dispatch:


permissions:
  contents: read
  id-token: write


concurrency:
  group: architecture-v2-preview
  cancel-in-progress: true


jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify architecture contracts
        run: node qa/architecture-v2-contracts.mjs
      - name: Inject Architecture V2 loader into preview build only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path('index.html')
          s=p.read_text()
          build=os.environ.get('GITHUB_SHA','172-pilot')
          marker=f'<script id="rym-v171-loader" src="/modules/v171-loader.js?v={build}"></script>\n'
          existing=re.compile(r'<script id="rym-v171-loader"[^>]*></script>\s*',re.I)
