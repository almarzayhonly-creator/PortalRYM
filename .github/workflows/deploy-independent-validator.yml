name: Deploy independent unit validator

on:
  push:
    branches: [codex/validator-independent-boot-fix]
    paths:
      - 'worker.js'
      - 'wrangler.validator.jsonc'
      - 'unit-validator.html'
      - 'validator-tablet-sw.js'
      - 'validator-tablet.webmanifest'
      - 'css/validator-tablet-app.css'
      - 'modules/core/unit-validator-shell.js'
      - 'modules/core/validator-session.js'
      - 'modules/control-auto/validator-presentation.js'
      - 'modules/control-auto/validator-details.js'
      - 'modules/control-auto/validator-tablet-app.js'
      - 'assets/rym-validator-*.png'
      - '.github/workflows/deploy-independent-validator.yml'

permissions:
  contents: read

concurrency:
  group: independent-unit-validator
  cancel-in-progress: true

jobs:
  deploy-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Worker syntax
        run: node --input-type=module --check < worker.js
      - name: Deploy only the independent validator Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.validator.jsonc
      - name: Verify independent validator routes
        shell: bash
        run: |
          set -euo pipefail
          url='https://validator-tablet-app-portal-ena-rym.almarzayhonly.workers.dev'
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 "$url/unit-validator" -o /tmp/validator-shell.html \
              && curl -fsSL --max-time 20 "$url/?validator-host=1" -o /tmp/validator-host.html \
              && grep -Fq 'unit-validator-shell-v32' /tmp/validator-shell.html \
              && grep -Fq '<title>Validador de Unidad</title>' /tmp/validator-host.html \
              && grep -Fq 'window.RYM_VALIDATOR_HOST=true' /tmp/validator-host.html \
              && grep -Fq '/modules/control-auto/validator-tablet-app-legacy.js?v=32' /tmp/validator-host.html; then
              echo 'Independent validator shell and host verified.'
              exit 0
            fi
            sleep 5
          done
          echo 'Independent validator deployment failed its route checks.' >&2
          exit 1
