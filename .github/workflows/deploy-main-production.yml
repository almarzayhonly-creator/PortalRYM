name: Deploy main production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portal-rym-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify controller syntax
        run: |
          node --check worker.js
          node --check modules/core/aracelys-messages.js
          node --check modules/core/dashboard-payments-enhance.js
          node --check modules/core/panapass-ranking-recurrentes-final.js
          node --check modules/core/panapass-ranking-criteria-final.js
          node --check modules/core/panapass-ranking-criteria-clickfix.js
          node --check modules/core/panapass-negativos-panama-date.js
      - name: Verify shared Unit Validator before deployment
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            npx playwright install --with-deps chromium
            CHROME_PATH="$(node -e "const {chromium}=require('playwright');process.stdout.write(chromium.executablePath())")"
          fi
          export PLAYWRIGHT_PATH="$PWD/node_modules/playwright" CHROME_PATH
          node qa/validator-presentation-contract.mjs
          node qa/validator-integrated-parity.mjs
          node qa/validator-independent-boot.mjs
          node qa/validator-portal-boot.mjs
          node --test qa/ecarcheck-restriction-export.test.cjs
          node qa/ecarcheck-restriction-export.browser.mjs
      - name: Persist production controllers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          love=Path('modules/core/aracelys-messages.js').read_text()
          dash=Path('modules/core/dashboard-payments-enhance.js').read_text()
          tabs=Path('modules/core/panapass-ranking-recurrentes-final.js').read_text()
          rank=Path('modules/core/panapass-ranking-criteria-final.js').read_text()
          clickfix=Path('modules/core/panapass-ranking-criteria-clickfix.js').read_text()
          negdate=Path('modules/core/panapass-negativos-panama-date.js').read_text()
          s=re.sub(r'<script id="rym-aracelys-messages"[^>]*></script>\s*','',s)
          s=re.sub(r'<script id="rym-aracelys-messages-v4"[^>]*></script>\s*','',s)
          for sid in ['rym-aracelys-messages-inline','rym-dashboard-payments-inline','rym-pay-competition-inline','rym-panapass-final-tabs-inline','rym-ranking-criteria-inline','rym-ranking-owner-lock-inline','rym-ranking-criteria-clickfix-inline','rym-negativos-panama-date-inline','rym-yhonly-change-alerts-inline']:
              s=re.sub(r'<script id="'+re.escape(sid)+r'">.*?</script>\s*','',s,flags=re.S)
          s=re.sub(r'<style id="rym-profile-top-only">.*?</style>\s*','',s,flags=re.S)
          guard='\n<style id="rym-profile-top-only">#rymLoveFab,#rymYhAlertBadge{display:none!important;visibility:hidden!important;pointer-events:none!important}</style>\n'
          marker=guard+'<script id="rym-aracelys-messages-inline">\n'+love+'\n</script>\n<script id="rym-dashboard-payments-inline">\n'+dash+'\n</script>\n<script id="rym-panapass-final-tabs-inline">\n'+tabs+'\n</script>\n<script id="rym-ranking-criteria-inline">\n'+rank+'\n</script>\n<script id="rym-ranking-criteria-clickfix-inline">\n'+clickfix+'\n</script>\n<script id="rym-negativos-panama-date-inline">\n'+negdate+'\n</script>\n'
          pos=s.lower().rfind('</body')
          if pos < 0: raise SystemExit('final body end not found')
          s=s[:pos]+marker+s[pos:]
          p.write_text(s)
          full=p.read_text()
          checks=['rym-profile-top-only','rym-aracelys-messages-inline','portal_mensajes_config','rym-dashboard-payments-inline','portal-home-resumen','rym-panapass-final-tabs-inline','rym-ranking-criteria-inline','rym-ranking-criteria-clickfix-inline','rym-negativos-panama-date-inline','panapass_reporte_competencia_cobrador_v2','panapass_ultima_fecha_pago','panapass_alertas_yhonly_pendientes']
          missing=[x for x in checks if x not in full]
          if missing: raise SystemExit('missing controllers: '+','.join(missing))
          if 'rym-yhonly-change-alerts-inline' in full: raise SystemExit('legacy standalone Yhonly alerts still present')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Persist top-only Yhonly profile [skip ci]"
            git push origin HEAD:main
          fi
      - name: Verify build files
        run: |
          test -s worker.js
          test -s index.html
          test -s modules/core/aracelys-messages.js
          test -s modules/core/dashboard-payments-enhance.js
          test -s modules/core/panapass-ranking-recurrentes-final.js
          test -s modules/core/panapass-ranking-criteria-final.js
          test -s modules/core/panapass-ranking-criteria-clickfix.js
          test -s modules/core/panapass-negativos-panama-date.js
          grep -Fq 'rym-profile-top-only' index.html
          grep -Fq 'rym-aracelys-messages-inline' index.html
          grep -Fq 'rym-dashboard-payments-inline' index.html
          grep -Fq 'rym-panapass-final-tabs-inline' index.html
          grep -Fq 'rym-ranking-criteria-inline' index.html
          grep -Fq 'rym-ranking-criteria-clickfix-inline' index.html
          grep -Fq 'rym-negativos-panama-date-inline' index.html
          grep -Fq 'panapass_reporte_competencia_cobrador_v2' index.html
          grep -Fq 'panapass_alertas_yhonly_pendientes' index.html
          ! grep -Fq 'rym-yhonly-change-alerts-inline' index.html
          ! grep -Fq 'rym-ranking-owner-lock-inline' index.html
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Verify deployed Unit Validator resource hashes
        run: node qa/validator-tablet-deployed.mjs "https://portal-ena-rym.almarzayhonly.workers.dev"
