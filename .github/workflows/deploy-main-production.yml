name: Deploy main production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-rym-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inject private messages module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          marker='<script id="rym-aracelys-messages" src="/modules/core/aracelys-messages.js?v=1"></script>\n'
          if 'id="rym-aracelys-messages"' not in s:
              m=re.search(r'<head\b[^>]*>',s,re.I)
              if not m: raise SystemExit('head start not found')
              s=s[:m.end()]+'\n'+marker+s[m.end():]
              p.write_text(s)
          if 'id="rym-aracelys-messages"' not in p.read_text()[:12000]:
              raise SystemExit('private messages module not injected')
          PY
      - name: Verify build files
        run: |
          test -s index.html
          test -s modules/core/aracelys-messages.js
          grep -Fq 'rym-aracelys-messages' index.html
          grep -Fq 'portal_mensajes_config' modules/core/aracelys-messages.js
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
