name: Deploy main production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portal-rym-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify controller syntax
        run: |
          node --check modules/core/aracelys-messages.js
          node --check modules/core/dashboard-payments-enhance.js
          node --check modules/core/reportes-competencia-pagos.js
      - name: Persist production controllers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          love=Path('modules/core/aracelys-messages.js').read_text()
          dash=Path('modules/core/dashboard-payments-enhance.js').read_text()
          comp=Path('modules/core/reportes-competencia-pagos.js').read_text()
          s=re.sub(r'<script id="rym-aracelys-messages"[^>]*></script>\s*','',s)
          s=re.sub(r'<script id="rym-aracelys-messages-v4"[^>]*></script>\s*','',s)
          s=re.sub(r'<script id="rym-aracelys-messages-inline">.*?</script>\s*','',s,flags=re.S)
          s=re.sub(r'<script id="rym-dashboard-payments-inline">.*?</script>\s*','',s,flags=re.S)
          s=re.sub(r'<script id="rym-pay-competition-inline">.*?</script>\s*','',s,flags=re.S)
          marker='\n<script id="rym-aracelys-messages-inline">\n'+love+'\n</script>\n<script id="rym-dashboard-payments-inline">\n'+dash+'\n</script>\n<script id="rym-pay-competition-inline">\n'+comp+'\n</script>\n'
          pos=s.lower().rfind('</body')
          if pos < 0: raise SystemExit('final body end not found')
          s=s[:pos]+marker+s[pos:]
          p.write_text(s)
          full=p.read_text()
          checks=['rym-aracelys-messages-inline','portal_mensajes_config','rym-dashboard-payments-inline','portal-home-resumen','rym-pay-competition-inline','panapass_reporte_pagos_competencia']
          missing=[x for x in checks if x not in full]
          if missing: raise SystemExit('missing controllers: '+','.join(missing))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Persist production controllers [skip ci]"
            git push origin HEAD:main
          fi
      - name: Verify build files
        run: |
          test -s index.html
          test -s modules/core/aracelys-messages.js
          test -s modules/core/dashboard-payments-enhance.js
          test -s modules/core/reportes-competencia-pagos.js
          grep -Fq 'rym-aracelys-messages-inline' index.html
          grep -Fq 'rym-dashboard-payments-inline' index.html
          grep -Fq 'rym-pay-competition-inline' index.html
          grep -Fq 'panapass_reporte_pagos_competencia' index.html
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
