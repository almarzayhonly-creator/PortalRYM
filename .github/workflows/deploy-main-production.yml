name: Deploy main production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portal-rym-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inline private messages controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          js=Path('modules/core/aracelys-messages.js').read_text()
          s=re.sub(r'<script id="rym-aracelys-messages"[^>]*></script>\s*','',s)
          s=re.sub(r'<script id="rym-aracelys-messages-v4"[^>]*></script>\s*','',s)
          s=re.sub(r'<script id="rym-aracelys-messages-inline">.*?</script>\s*','',s,flags=re.S)
          marker='\n<script id="rym-aracelys-messages-inline">\n'+js+'\n</script>\n'
          m=re.search(r'</body\s*>',s,re.I)
          if not m: raise SystemExit('body end not found')
          s=s[:m.start()]+marker+s[m.start():]
          p.write_text(s)
          tail=p.read_text()[-25000:]
          if 'id="rym-aracelys-messages-inline"' not in tail or 'portal_mensajes_config' not in tail:
              raise SystemExit('private messages inline controller not injected')
          PY
      - name: Verify build files
        run: |
          test -s index.html
          test -s modules/core/aracelys-messages.js
          grep -Fq 'rym-aracelys-messages-inline' index.html
          grep -Fq 'portal_mensajes_config' index.html
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
