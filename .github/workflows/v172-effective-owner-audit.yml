name: V172 effective owner audit
on:
  push:
    branches: [v172-clean]
    paths:
      - 'tools/v172_effective_owner_audit.mjs'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v172-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save acorn
      - run: node tools/v172_effective_owner_audit.mjs
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/arquitectura/V172_EFFECTIVE_OWNERS.json
          if git diff --cached --quiet; then exit 0; fi
          git pull --rebase origin v172-clean
          git push origin HEAD:v172-clean
