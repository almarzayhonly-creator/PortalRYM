name: Vue Next pilot

on:
  push:
    branches: [sandbox/portal-vue-next]
    paths:
      - 'index.html'
      - 'worker.js'
      - 'modules/core/dashboard-payments-enhance.js'
      - 'qa/home-executive.mjs'
      - 'vue-next/**'
      - '.github/workflows/vue-next-pilot.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'worker.js'
      - 'modules/core/dashboard-payments-enhance.js'
      - 'qa/home-executive.mjs'
      - 'vue-next/**'
      - '.github/workflows/vue-next-pilot.yml'

permissions:
  contents: read

concurrency:
  group: vue-next-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vue-next/package-lock.json
      - name: Build Vue pilot and require split Panapass assets
        working-directory: vue-next
        run: |
          npm ci
          npm run build
          test -s dist/portal-rym-vue-next.js
          test -s dist/portal-rym-vue-next.css
          test -s dist/panapass.css
          test -s dist/portal-rym-vue-next-PanapassView.js
      - name: Install isolated browser QA
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Compare Panapass reads and states against MAIN fixtures
        env:
          PLAYWRIGHT_PATH: ${{ github.workspace }}/node_modules/playwright
        run: |
          CHROME_PATH="$(node -e "const {chromium}=require('playwright');process.stdout.write(chromium.executablePath())")"
          export CHROME_PATH
          node qa/home-executive.mjs --vue-next-panapass-dashboard
