name: V172 Portal semantic cleanup
on:
  push:
    branches: [v172-clean]
    paths:
      - 'tools/v172_portal_semantic_cleanup.mjs'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v172-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save acorn
      - run: node tools/v172_portal_semantic_cleanup.mjs
      - name: Validate
        run: |
          node --check modules/core/portal-v70.js
          node --check modules/core/portal-home-v99.js
          ! grep -Fq 'window.v36PortalHome=function' modules/core/portal-v70.js
          ! grep -Fq 'window.v36PortalHome=async function' modules/core/portal-home-v99.js
          grep -Fq "RYM_ROUTER?.open('panapass')" modules/core/portal-v70.js
          grep -Fq "RYM_ROUTER?.open('control-auto')" modules/core/portal-v70.js
          grep -Fq "RYM_ROUTER?.open('revisados')" modules/core/portal-home-v99.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/core
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V172 clean: route Portal Home and module entries through canonical owners'
          git push origin HEAD:v172-clean
