name: V172 clean legacy ownership audit
on:
  push:
    branches: [v172-clean]
    paths:
      - 'tools/v172_legacy_ownership_audit.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v172-clean
          fetch-depth: 0
      - name: Audit legacy owners
        run: python3 tools/v172_legacy_ownership_audit.py > /tmp/v172-legacy-audit.txt
      - name: Commit inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/arquitectura/V172_LEGACY_OWNERSHIP.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V172 clean: inventory remaining legacy owners'
          git push origin HEAD:v172-clean
