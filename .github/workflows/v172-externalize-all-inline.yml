name: V172 externalize all inline
on:
  push:
    branches: [v172-clean]
    paths:
      - 'tools/v172_externalize_all_inline.py'
permissions:
  contents: write
jobs:
  externalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v172-clean
          fetch-depth: 0
      - name: Externalize all inline style and JS
        run: python3 tools/v172_externalize_all_inline.py
      - name: Validate zero inline and JS syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert not re.search(r'<style(?:\s|>)',s,re.I)
          for m in re.finditer(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>',s,re.S|re.I):
              assert re.search(r'\bsrc\s*=',m.group('attrs'),re.I) or not m.group('body').strip()
          print('index bytes',len(s.encode()))
          PY
          find modules -type f -path '*/runtime/*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit zero-inline source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html modules css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V172 clean: externalize all remaining inline code by owner'
          git push origin HEAD:v172-clean
