name: Validator tablet app preview

on:
  push:
    branches: [sandbox/validator-tablet-app]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validator-tablet-app-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify main parity and tablet app files
        run: |
          git fetch --depth=1 origin main
          test "$(git rev-parse HEAD^0)" != ""
          node --check worker.js
          node --check modules/v171-loader.js
          node --check modules/control-auto/validator-tablet-app.js
          node --check validator-tablet-sw.js
          test -s css/validator-tablet-app.css
          test -s validator-tablet.webmanifest
          test -s assets/validator-tablet-icon.svg
          grep -Fq 'v101ValidatorQ' modules/control-auto/validator-tablet-app.js
          grep -Fq 'validator-tablet-app.js' modules/v171-loader.js
          grep -Fq 'validator-tablet-app.css' modules/v171-loader.js
          grep -Fq '"start_url": "/?app=validador-unidad"' validator-tablet.webmanifest

      - name: Deploy isolated Cloudflare preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest versions upload --preview-alias validator-tablet-app 2>&1 | tee /tmp/wrangler.out
          VERSION_URL=$(grep -Eo 'https://[a-f0-9-]+-portal-ena-rym\.almarzayhonly\.workers\.dev' /tmp/wrangler.out | head -1)
          test -n "$VERSION_URL"
          echo "version_url=$VERSION_URL" >> "$GITHUB_OUTPUT"
          echo "alias_url=https://validator-tablet-app-portal-ena-rym.almarzayhonly.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Verify immutable preview
        env:
          VERSION_URL: ${{ steps.deploy.outputs.version_url }}
        run: |
          curl -fsSL "$VERSION_URL/?app=validador-unidad" -o /tmp/index.html
          curl -fsSL "$VERSION_URL/modules/v171-loader.js" -o /tmp/loader.js
          curl -fsSL "$VERSION_URL/modules/control-auto/validator-tablet-app.js" -o /tmp/app.js
          curl -fsSL "$VERSION_URL/css/validator-tablet-app.css" -o /tmp/app.css
          curl -fsSL "$VERSION_URL/validator-tablet.webmanifest" -o /tmp/manifest.json
          grep -Fq 'validator-tablet-app.js' /tmp/loader.js
          grep -Fq 'v101ValidatorQ' /tmp/app.js
          grep -Fq 'rym-unit-validator-app' /tmp/app.css
          grep -Fq 'app=validador-unidad' /tmp/manifest.json

      - name: Verify preview alias
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.alias_url }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSL "$ALIAS_URL/modules/control-auto/validator-tablet-app.js" -o /tmp/alias-app.js \
              && grep -Fq 'v101ValidatorQ' /tmp/alias-app.js \
              && curl -fsSL "$ALIAS_URL/validator-tablet.webmanifest" -o /tmp/alias-manifest.json \
              && grep -Fq 'app=validador-unidad' /tmp/alias-manifest.json; then
              echo "Validator tablet preview propagated."
              exit 0
            fi
            sleep 5
          done
          echo "Validator tablet alias did not propagate." >&2
          exit 1
