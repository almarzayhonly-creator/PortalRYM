name: Validator tablet app preview

on:
  push:
    branches: [sandbox/validator-tablet-app]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validator-tablet-app-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify main parity and tablet app files
        run: |
          git fetch --depth=1 origin main
          git diff --exit-code origin/main -- index.html
          test "$(git rev-parse HEAD^0)" != ""
          node --check worker.js
          node --check modules/v171-loader.js
          node --check modules/control-auto/validator-tablet-app.js
          node --check modules/core/unit-validator-shell.js
          node --check modules/core/unit-validator-launcher.js
          node --check validator-tablet-sw.js
          test -s css/validator-tablet-app.css
          test -s validator-tablet.webmanifest
          test -s assets/validator-tablet-icon.svg
          test -s assets/rym-validator-192.png
          test -s assets/rym-validator-512.png
          test -s unit-validator.html
          test -s modules/core/unit-validator-launcher.js
          grep -Fq 'control_auto.validador_unidad_app' unit-validator.html
          grep -Fq 'control_auto.validador_unidad_app' modules/core/unit-validator-launcher.js
          grep -Fq 'v101ValidatorQ' modules/control-auto/validator-tablet-app.js
          ! grep -Fq 'validator-tablet-app.js' modules/v171-loader.js
          ! grep -Fq 'validator-tablet-app.css' modules/v171-loader.js
          grep -Fq 'validator-tablet-app.css?v=8' unit-validator.html
          grep -Fq 'unit-validator-shell.js?v=8' unit-validator.html
          grep -Fq 'validator-tablet-app.js?v=8' worker.js
          grep -Fq 'validator-tablet-app.css?v=8' worker.js
          grep -Fq "rym-unit-validator-shell-v8" validator-tablet-sw.js
          grep -Fq '"start_url": "/?app=validador-unidad"' validator-tablet.webmanifest

      - name: Test dedicated validator against main functions
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            npx playwright install --with-deps chromium
            CHROME_PATH="$(node -e "const {chromium}=require('playwright');process.stdout.write(chromium.executablePath())")"
          fi
          PLAYWRIGHT_PATH="$PWD/node_modules/playwright" CHROME_PATH="$CHROME_PATH" node qa/validator-tablet-responsive.mjs
          node qa/validator-tablet-contract.mjs

      - name: Upload responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validator-responsive-evidence
          path: .sandbox/validator-qa


      - name: Deploy isolated Cloudflare preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest versions upload --preview-alias validator-tablet-app 2>&1 | tee /tmp/wrangler.out
          VERSION_URL=$(grep -Eo 'https://[a-f0-9-]+-portal-ena-rym\.almarzayhonly\.workers\.dev' /tmp/wrangler.out | head -1)
          test -n "$VERSION_URL"
          echo "version_url=$VERSION_URL" >> "$GITHUB_OUTPUT"
          echo "alias_url=https://validator-tablet-app-portal-ena-rym.almarzayhonly.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Verify immutable preview
        env:
          VERSION_URL: ${{ steps.deploy.outputs.version_url }}
        run: |
          curl -fsSL -D /tmp/headers.txt "$VERSION_URL/?app=validador-unidad" -o /tmp/index.html
          curl -fsSL "$VERSION_URL/modules/v171-loader.js" -o /tmp/loader.js
          curl -fsSL "$VERSION_URL/modules/control-auto/validator-tablet-app.js" -o /tmp/app.js
          curl -fsSL "$VERSION_URL/css/validator-tablet-app.css" -o /tmp/app.css
          curl -fsSL "$VERSION_URL/validator-tablet.webmanifest" -o /tmp/manifest.json
          grep -Fq 'Validador de Unidad' /tmp/index.html
          grep -Fq 'control_auto.validador_unidad_app' /tmp/index.html
          grep -Fq 'x-rym-app: unit-validator' /tmp/headers.txt
          grep -Fq 'validator-tablet-app.js' /tmp/loader.js
          grep -Fq 'v101ValidatorQ' /tmp/app.js
          grep -Fq 'rym-unit-validator-app' /tmp/app.css
          grep -Fq 'app=validador-unidad' /tmp/manifest.json

      - name: Verify preview alias
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.alias_url }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSL "$ALIAS_URL/?app=validador-unidad" -o /tmp/alias-index.html \
              && grep -Fq 'control_auto.validador_unidad_app' /tmp/alias-index.html \
              && curl -fsSL "$ALIAS_URL/modules/core/unit-validator-launcher.js" -o /tmp/alias-launcher.js \
              && grep -Fq 'control_auto.validador_unidad_app' /tmp/alias-launcher.js \
              && curl -fsSL "$ALIAS_URL/validator-tablet.webmanifest" -o /tmp/alias-manifest.json \
              && grep -Fq 'app=validador-unidad' /tmp/alias-manifest.json; then
              echo "Validator tablet preview propagated."
              exit 0
            fi
            sleep 5
          done
          echo "Validator tablet alias did not propagate." >&2
          exit 1
