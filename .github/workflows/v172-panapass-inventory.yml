name: V172 Panapass ownership inventory
on:
  push:
    branches: [v172-clean]
    paths:
      - 'tools/v172_panapass_inventory.py'
permissions:
  contents: write
concurrency:
  group: v172-panapass-inventory
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v172-clean
          fetch-depth: 0
      - name: Build Panapass ownership inventory
        run: python3 tools/v172_panapass_inventory.py
      - name: Commit inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/arquitectura/V172_PANAPASS_INVENTORY.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V172 clean: inventory Panapass ownership'
          git push origin HEAD:v172-clean
