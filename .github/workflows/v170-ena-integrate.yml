name: Integrate isolated ENA module
on:
  push:
    branches: [v170-ena-pdf-calibration]
    paths:
      - '.github/workflows/v170-ena-integrate.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v170-ena-pdf-calibration
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Link ENA modules into portal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          markers=['<script src="/js/ena-transferencia.js?v=170ena1"></script>','<script src="/js/ena-pdf-engine.js?v=170ena1"></script>']
          pos=s.lower().rfind('</body>')
          if pos < 0: raise SystemExit('index.html has no </body>')
          for marker in markers:
              if marker not in s:
                  s=s[:pos]+marker+'\n'+s[pos:]
                  pos=s.lower().rfind('</body>')
          p.write_text(s,encoding='utf-8')
          for marker in markers:
              if s.count(marker) != 1: raise SystemExit('ENA marker count must be 1')
          PY
          test -s js/ena-transferencia.js
          test -s js/ena-pdf-engine.js
      - name: Commit integration only
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'portal-rym-bot'
          git config user.email 'portal-rym-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Integrate ENA PDF engine'
          git push origin HEAD:v170-ena-pdf-calibration
