name: Panapass sandbox preview

on:
  push:
    branches: [sandbox/panapass-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panapass-sandbox-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify sandbox files
        run: |
          node --check worker.js
          node --check modules/panapass-sandbox/dashboard/index.js
          node --check modules/v171-loader.js
          node --check modules/core/bootstrap.js
          node --check modules/core/legacy-route-bridge.js
          node --check modules/panapass/index.js
          node --check modules/revisados/index.js
          test -s css/panapass-sandbox/tokens.css
          test -s vue/package.json
          test -s vue/vite.config.ts
      - name: Build Vue Revisados pilot
        working-directory: vue
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -d dist/assets
          VUE_ASSET=$(grep -Eo '/vue/dist/assets/[^" ]+\.js' dist/index.html | head -1)
          test -n "$VUE_ASSET"
          test -s ".${VUE_ASSET#/vue}"
          grep -Fq 'data-ui-source' ".${VUE_ASSET#/vue}"
          grep -Fq 'rv-brand-dark' ".${VUE_ASSET#/vue}"
          grep -Fq 'rv-global-control' ".${VUE_ASSET#/vue}"
      - name: Inject sandbox bootstrap into preview build only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('index.html')
          s=p.read_text()
          build=os.environ['GITHUB_SHA']
          marker=f'<link rel="stylesheet" href="/css/panapass-sandbox/tokens.css?v={build}">\n<div class="pps-sandbox-badge" data-sandbox-build="{build}">PANAPASS · SANDBOX V2 · {build[:7]}</div>\n<script src="/modules/panapass-sandbox/dashboard/index.js?v={build}" defer></script>\n<script src="/modules/v171-loader.js?v={build}" defer></script>\n'
          pos=s.lower().rfind('</body>')
          if pos < 0: raise SystemExit('body end not found')
          p.write_text(s[:pos]+marker+s[pos:])
          PY
      - name: Deploy isolated Cloudflare Preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          EXPECTED_ASSET=$(grep -Eo '/vue/dist/assets/[^" ]+\.js' vue/dist/index.html | head -1)
          test -n "$EXPECTED_ASSET"
          npx --yes wrangler@latest preview --name sandbox-panapass-v2 --message "sandbox ${GITHUB_SHA}"
          echo "preview_url=https://sandbox-panapass-v2-portal-ena-rym.almarzayhonly.workers.dev" >> "$GITHUB_OUTPUT"
          echo "expected_asset=$EXPECTED_ASSET" >> "$GITHUB_OUTPUT"

      - name: Verify stable Preview
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          EXPECTED_ASSET: ${{ steps.deploy.outputs.expected_asset }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 18); do
            curl -fsSL "$PREVIEW_URL/?sandboxBuild=$GITHUB_SHA&revisadosVue=1" -o /tmp/preview-root.html || true
            curl -fsSL "$PREVIEW_URL/modules/panapass-sandbox/dashboard/index.js?v=$GITHUB_SHA" -o /tmp/sandbox.js || true
            curl -fsSL "$PREVIEW_URL/modules/v171-loader.js?v=$GITHUB_SHA" -o /tmp/loader.js || true
            curl -fsSL "$PREVIEW_URL/modules/revisados/index.js?v=$GITHUB_SHA" -o /tmp/revisados.js || true
            curl -fsSL "$PREVIEW_URL/vue/dist/index.html?build=$GITHUB_SHA" -o /tmp/vue.html || true

            ROOT_OK=0
            VUE_OK=0
            grep -Fq "PANAPASS · SANDBOX V2 · ${GITHUB_SHA:0:7}" /tmp/preview-root.html && ROOT_OK=$((ROOT_OK+1)) || true
            grep -Fq "/modules/v171-loader.js?v=$GITHUB_SHA" /tmp/preview-root.html && ROOT_OK=$((ROOT_OK+1)) || true
            grep -Fq 'PANAPASS_SANDBOX_V2' /tmp/sandbox.js && ROOT_OK=$((ROOT_OK+1)) || true
            grep -Fq 'RYM_REVISADOS_BRIDGE' /tmp/revisados.js && ROOT_OK=$((ROOT_OK+1)) || true
            grep -Fq "$EXPECTED_ASSET" /tmp/vue.html && VUE_OK=1 || true

            if [ "$ROOT_OK" -eq 4 ] && [ "$VUE_OK" -eq 1 ]; then
              curl -fsSL "$PREVIEW_URL$EXPECTED_ASSET?v=$GITHUB_SHA" -o /tmp/vue-bundle.js || true
              BUNDLE_OK=0
              grep -Fq 'data-ui-source' /tmp/vue-bundle.js && BUNDLE_OK=$((BUNDLE_OK+1)) || true
              grep -Fq 'rv-brand-dark' /tmp/vue-bundle.js && BUNDLE_OK=$((BUNDLE_OK+1)) || true
              grep -Fq 'rv-global-control' /tmp/vue-bundle.js && BUNDLE_OK=$((BUNDLE_OK+1)) || true
              if [ "$BUNDLE_OK" -eq 3 ]; then
                echo "Stable Preview updated to $GITHUB_SHA on attempt $attempt"
                exit 0
              fi
            fi

            echo "Preview not fully propagated yet (attempt $attempt/18, root=$ROOT_OK/4, vue=$VUE_OK/1)"
            sleep 5
          done

          echo "Stable Preview did not propagate the requested build." >&2
          exit 1

