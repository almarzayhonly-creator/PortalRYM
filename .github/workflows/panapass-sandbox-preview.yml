name: Panapass sandbox preview

on:
  push:
    branches: [sandbox/panapass-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panapass-sandbox-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify sandbox files
        run: |
          node --check worker.js
          node --check modules/panapass-sandbox/dashboard/index.js
          node --check modules/v171-loader.js
          node --check modules/core/bootstrap.js
          node --check modules/core/legacy-route-bridge.js
          node --check modules/panapass/index.js
          node --check modules/revisados/index.js
          test -s css/panapass-sandbox/tokens.css
          test -s vue/package.json
          test -s vue/vite.config.ts
      - name: Build Vue Revisados pilot
        working-directory: vue
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s dist/index.html
          test -d dist/assets
          VUE_ASSET=$(grep -Eo '/vue/dist/assets/[^" ]+\.js' dist/index.html | head -1)
          test -n "$VUE_ASSET"
          test -s ".${VUE_ASSET#/vue}"
          grep -Fq 'data-ui-source' ".${VUE_ASSET#/vue}"
          grep -Fq 'rv-brand-dark' ".${VUE_ASSET#/vue}"
          grep -Fq 'rv-command-dashboard' ".${VUE_ASSET#/vue}"
      - name: Inject sandbox build identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('index.html')
          s=p.read_text()
          build=os.environ['GITHUB_SHA']
          marker=f'<div class="pps-sandbox-badge" data-sandbox-build="{build}"></div>\n'
          pos=s.lower().rfind('</body>')
          if pos < 0: raise SystemExit('body end not found')
          p.write_text(s[:pos]+marker+s[pos:])
          PY
      - name: Deploy isolated Cloudflare preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          EXPECTED_ASSET=$(grep -Eo '/vue/dist/assets/[^" ]+\.js' vue/dist/index.html | head -1)
          test -n "$EXPECTED_ASSET"
          npx --yes wrangler@latest versions upload --preview-alias sandbox-panapass-v2 2>&1 | tee /tmp/wrangler.out
          VERSION_URL=$(grep -Eo 'https://[a-f0-9-]+-portal-ena-rym\.almarzayhonly\.workers\.dev' /tmp/wrangler.out | head -1)
          test -n "$VERSION_URL"
          echo "version_url=$VERSION_URL" >> "$GITHUB_OUTPUT"
          echo "alias_url=https://sandbox-panapass-v2-portal-ena-rym.almarzayhonly.workers.dev" >> "$GITHUB_OUTPUT"
          echo "expected_asset=$EXPECTED_ASSET" >> "$GITHUB_OUTPUT"
          echo "Version preview: $VERSION_URL"
          echo "Alias preview: https://sandbox-panapass-v2-portal-ena-rym.almarzayhonly.workers.dev"
      - name: Verify immutable version preview
        env:
          VERSION_URL: ${{ steps.deploy.outputs.version_url }}
          EXPECTED_ASSET: ${{ steps.deploy.outputs.expected_asset }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          curl -fsSL "$VERSION_URL/?sandbox=1&revisadosVue=1" -o /tmp/index.html
          curl -fsSL "$VERSION_URL/modules/panapass-sandbox/dashboard/index.js" -o /tmp/sandbox.js
          curl -fsSL "$VERSION_URL/modules/v171-loader.js" -o /tmp/loader.js
          curl -fsSL "$VERSION_URL/modules/revisados/index.js" -o /tmp/revisados.js
          curl -fsSL "$VERSION_URL/vue/dist/index.html" -o /tmp/vue.html
          grep -Fq 'panapass-sandbox/tokens.css' /tmp/index.html
          grep -Fq "data-sandbox-build=\"$GITHUB_SHA\"" /tmp/index.html
          grep -Fq "PANAPASS · SANDBOX V2 · ${GITHUB_SHA:0:7}" /tmp/index.html
          grep -Fq 'PANAPASS_SANDBOX_V2' /tmp/sandbox.js
          grep -Fq 'dashboard-v2/index.js' /tmp/loader.js
          grep -Fq 'RYM_REVISADOS_BRIDGE' /tmp/revisados.js
          grep -Fq 'bust(src)' /tmp/revisados.js
          grep -Fq "$EXPECTED_ASSET" /tmp/vue.html
          curl -fsSL "$VERSION_URL$EXPECTED_ASSET?v=$GITHUB_SHA" -o /tmp/vue-bundle.js
          grep -Fq 'data-ui-source' /tmp/vue-bundle.js
          grep -Fq 'rv-brand-dark' /tmp/vue-bundle.js
          grep -Fq 'rv-command-dashboard' /tmp/vue-bundle.js
          curl -fsSI "$VERSION_URL$EXPECTED_ASSET?v=$GITHUB_SHA" | grep -qi '^HTTP/.* 200'
      - name: Verify canonical alias propagation
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.alias_url }}
          EXPECTED_ASSET: ${{ steps.deploy.outputs.expected_asset }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 12); do
            curl -fsSL "$ALIAS_URL/?sandbox=1&revisadosVue=1" -o /tmp/alias-root.html || true
            curl -fsSL "$ALIAS_URL/vue/dist/index.html" -o /tmp/alias-vue.html || true
            ROOT_OK=0
            VUE_OK=0
            grep -Fq "data-sandbox-build=\"$GITHUB_SHA\"" /tmp/alias-root.html && ROOT_OK=1 || true
            grep -Fq "/modules/v171-loader.js?v=$GITHUB_SHA" /tmp/alias-root.html && ROOT_OK=$((ROOT_OK+1)) || true
            grep -Fq "$EXPECTED_ASSET" /tmp/alias-vue.html && VUE_OK=1 || true
            if [ "$ROOT_OK" -eq 2 ] && [ "$VUE_OK" -eq 1 ]; then
              curl -fsSL "$ALIAS_URL$EXPECTED_ASSET?v=$GITHUB_SHA" -o /tmp/alias-vue-bundle.js || true
              BUNDLE_OK=0
              grep -Fq 'data-ui-source' /tmp/alias-vue-bundle.js && BUNDLE_OK=$((BUNDLE_OK+1)) || true
              grep -Fq 'rv-brand-dark' /tmp/alias-vue-bundle.js && BUNDLE_OK=$((BUNDLE_OK+1)) || true
              grep -Fq 'rv-command-dashboard' /tmp/alias-vue-bundle.js && BUNDLE_OK=$((BUNDLE_OK+1)) || true
              if [ "$BUNDLE_OK" -eq 3 ]; then
                echo "Alias root + Stitch Vue bundle propagated on attempt $attempt"
                curl -fsSI "$ALIAS_URL$EXPECTED_ASSET?v=$GITHUB_SHA" | grep -qi '^HTTP/.* 200'
                exit 0
              fi
            fi
            echo "Alias has not fully propagated (attempt $attempt/12, root=$ROOT_OK/2, vue=$VUE_OK/1)"
            sleep 5
          done
          echo "Alias root or Vue bundle did not propagate correctly." >&2
          exit 1
