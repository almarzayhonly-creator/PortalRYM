name: V172 clean GPS extraction
on:
  push:
    branches: [v172-clean]
    paths:
      - 'tools/v172_extract_gps.py'
permissions:
  contents: write
concurrency:
  group: v172-clean-gps-extract
  cancel-in-progress: true
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v172-clean
          fetch-depth: 0
      - name: Extract GPS V157
        run: python3 tools/v172_extract_gps.py
      - name: Validate GPS
        run: |
          node --check modules/gps/app.js
          node --check modules/gps/index.js
          grep -Fq 'window.RYM_GPS_APP' modules/gps/app.js
          grep -Fq '/modules/gps/app.js' index.html
          grep -Fq '/css/gps-v157.css' index.html
          ! grep -Fq '<script id="rym-v157-gps-js">' index.html
          ! grep -Fq '<style id="rym-v157-gps-css">' index.html
      - name: Commit GPS extraction
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html modules css tools
          git commit -m 'V172 clean: extract GPS V157 app and CSS'
          git push origin HEAD:v172-clean
