name: Open competitive payments report in new window
on:
  push:
    branches: [main]
    paths: ['.github/workflows/report-pagos-diagnostic.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch active report handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          marker="document.querySelector('#rComp').onclick="
          i=s.rfind(marker)
          if i<0: raise SystemExit('active rComp handler not found')
          j=s.find("\n  document.querySelector('#rFon').onclick",i)
          if j<0: raise SystemExit('rFon boundary not found')
          replacement="document.querySelector('#rComp').onclick=()=>{if(typeof window.RYMOpenCompetitivePayments==='function')window.RYMOpenCompetitivePayments();else alert('El reporte competitivo está cargando. Intenta nuevamente en un segundo.');};"
          s=s[:i]+replacement+s[j:]
          s=s.replace('<div id="repCompOut" style="margin-top:14px"></div>','')
          p.write_text(s)
          if "RYMOpenCompetitivePayments" not in s: raise SystemExit('new window handler missing')
          if "id=\"compGal\"" in s[i:i+8000]: raise SystemExit('old inline competitive UI still attached to active handler')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Open competitive payments in new window"
          git push origin HEAD:main
