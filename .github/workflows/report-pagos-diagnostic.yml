name: Inspect dashboard and reports DOM
on:
  push:
    branches: [main]
    paths: ['.github/workflows/report-pagos-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect DOM anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          needles=['PAGADO ESTE MES','Pagado este mes','PAGADAS HOY','Pagadas hoy','MONTO PAGADO','Monto pagado','Pagos · 4 Galeras','Pagos por Galera','id="r4"','report-grid','report-card','repDesde','repHasta']
          for n in needles:
              print('\n###',n,'COUNT',s.count(n))
              start=0
              for k in range(4):
                  i=s.find(n,start)
                  if i<0: break
                  print('INDEX',i)
                  print(s[max(0,i-1200):min(len(s),i+2200)])
                  start=i+len(n)
          PY
