name: Polish V169 Panapass
on:
  push:
    branches: [cleanup-v168]
    paths: ['.github/workflows/v169-panapass-polish.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-v168
          fetch-depth: 0
      - name: Patch Panapass UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('panapass-v169-final.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace(".v169-rank-streak{display:inline-flex", ".v169-rank-streak{display:none!important;display:inline-flex")
          s=s.replace("${metric==='UNIDADES'?` · racha 0: ${streak}d`:''}", "")
          s=s.replace("<div class=\"v169-rec-toolbar\"", "<div class=\"v169-rec-toolbar\"")
          s=s.replace(".v169-rec-toolbar{display:grid;grid-template-columns:minmax(210px,1.25fr) repeat(3,minmax(135px,.58fr)) auto;gap:8px;align-items:end;margin-bottom:8px}", ".v169-rec-toolbar{display:grid;grid-template-columns:minmax(300px,1.5fr) minmax(160px,.55fr) minmax(150px,.45fr) minmax(120px,.38fr) auto;gap:7px;align-items:end;margin-bottom:7px}")
          s=s.replace(".v169-rec-toolbar .v123-rec-mode{display:flex;gap:5px;align-items:center}", ".v169-rec-toolbar .v123-rec-mode{display:flex;gap:5px;align-items:center;min-width:0}")
          s=s.replace(".v169-rec-toolbar>button{min-height:37px!important;padding:7px 12px!important}", ".v169-rec-toolbar>button{min-height:35px!important;padding:6px 12px!important;width:auto!important;min-width:110px!important;justify-self:end!important}")
          s=s.replace(".v169-rec-search{margin:0 0 8px!important}", ".v169-rec-search{margin:0 0 6px!important}")
          s=s.replace(".v169-rec-context{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;padding:7px 10px", ".v169-rec-context{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px;padding:5px 9px")
          s=s.replace(".v169-rec .v123-rec-summary{gap:7px;margin-bottom:8px}", ".v169-rec .v123-rec-summary{gap:6px;margin-bottom:6px}")
          s=s.replace("padding:9px 11px!important", "padding:7px 10px!important")
          s=s.replace("font-size:20px!important", "font-size:18px!important")
          s=s.replace("padding:7px 8px!important", "padding:5px 7px!important")
          p.write_text(s,encoding='utf-8')
          PY
          node --check panapass-v169-final.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add panapass-v169-final.js
          git commit -m 'Polish V169 Panapass ranking and recurrentes'
          git push origin HEAD:cleanup-v168
