name: Deploy V170 ENA test preview
on:
  push:
    branches: [v170-ena-pdf-calibration]
    paths:
      - '.github/workflows/deploy-v170-ena-preview.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v170-ena-pdf-calibration
      - name: Verify ENA modules
        run: |
          grep -Fq 'js/ena-transferencia.js?v=170ena1' index.html
          grep -Fq 'js/ena-pdf-engine.js?v=170ena1' index.html
          test -s js/ena-transferencia.js
          test -s js/ena-pdf-engine.js
      - name: Deploy isolated preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@latest versions upload --preview-alias v170-ena-test
      - name: Verify preview
        run: |
          URL='https://v170-ena-test-portal-ena-rym.almarzayhonly.workers.dev'
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 "$URL/?check=$(date +%s)" -o /tmp/p.html \
              && curl -fsSL --max-time 20 "$URL/js/ena-transferencia.js?check=$(date +%s)" -o /tmp/c.js \
              && curl -fsSL --max-time 20 "$URL/js/ena-pdf-engine.js?check=$(date +%s)" -o /tmp/e.js \
              && grep -Fq 'ena-transferencia.js?v=170ena1' /tmp/p.html \
              && grep -Fq 'ena-pdf-engine.js?v=170ena1' /tmp/p.html \
              && grep -Fq 'RYM_ENA_TRANSFERENCIA' /tmp/c.js \
              && grep -Fq 'RYM_ENA_PDF_ENGINE' /tmp/e.js; then
                echo "PREVIEW_OK=$URL"
                exit 0
            fi
            sleep 5
          done
          exit 1
