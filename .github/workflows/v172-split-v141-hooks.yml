name: V172 split V141 hooks
on:
  push:
    branches: [v172-clean]
    paths:
      - 'tools/v172_split_v141_hooks.py'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v172-clean
          fetch-depth: 0
      - name: Split V141 ownership
        run: python3 tools/v172_split_v141_hooks.py
      - name: Validate
        run: |
          node --check modules/usuarios/index.js
          node --check modules/revisados/runtime/063-rym-v141-activity-cupos-mail-js-80ed7e76.js
          ! grep -Fq 'window.v70OpenUsers=async function' modules/revisados/runtime/063-rym-v141-activity-cupos-mail-js-80ed7e76.js
          ! grep -Fq 'window.v94ControlCuposATTT=async function' modules/revisados/runtime/063-rym-v141-activity-cupos-mail-js-80ed7e76.js
          grep -Fq '__RYM_USERS_PENDING_AFTER__' modules/revisados/runtime/063-rym-v141-activity-cupos-mail-js-80ed7e76.js
          grep -Fq '__RYM_CONTROL_PENDING_AFTER__' modules/revisados/runtime/063-rym-v141-activity-cupos-mail-js-80ed7e76.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V172 clean: move V141 Users and Cupos extensions to lifecycle hooks'
          git push origin HEAD:v172-clean
