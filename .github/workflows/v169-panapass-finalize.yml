name: Finalize V169 Panapass
on:
  push:
    branches: [cleanup-v168]
    paths:
      - 'panapass-v169-final.js'
      - '.github/workflows/v169-panapass-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-v168
          fetch-depth: 0
      - name: Inject V169 Panapass final script safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="panapass-v169-final.js?v=169"></script>'
          # Remove any prior V169 tag, including the bad insertion inside legacy JS/template text.
          s=s.replace(tag+'\n','').replace(tag,'')
          marker='</body>'
          pos=s.rfind(marker)
          if pos < 0:
              raise SystemExit('missing final </body>')
          s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          tag='<script src="panapass-v169-final.js?v=169"></script>'
          assert s.count(tag)==1, f'expected one V169 tag, got {s.count(tag)}'
          assert s.rfind(tag) < s.rfind('</body>')
          assert s.rfind('</script>') < s.rfind('</body>')
          print('Safe V169 injection verified')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'Already injected safely'
          else
            git add index.html
            git commit -m 'Repair V169 Panapass script placement'
            git push origin HEAD:cleanup-v168
          fi
