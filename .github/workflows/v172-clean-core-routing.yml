name: V172 clean core routing
on:
  push:
    branches: [v172-clean]
    paths:
      - 'tools/v172_clean_core_routing.py'
permissions:
  contents: write
concurrency:
  group: v172-clean-core-routing
  cancel-in-progress: true
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v172-clean
          fetch-depth: 0
      - name: Route canonical Panapass views and extract V70
        run: python3 tools/v172_clean_core_routing.py
      - name: Validate syntax
        run: |
          node --check modules/core/runtime.js
          node --check modules/core/portal-v70.js
          node --check modules/panapass/ranking/index.js
          node --check modules/panapass/recurrentes/index.js
      - name: Validate ownership
        run: |
          grep -Fq "RYM_MODULES.open('panapass-ranking',{target:v})" modules/core/runtime.js
          grep -Fq "RYM_MODULES.open('panapass-recurrentes',{target:v})" modules/core/runtime.js
          ! grep -Fq "if(state.active==='ranking')return ranking(v)" modules/core/runtime.js
          ! grep -Fq "if(state.active==='recurrentes')return recurrentes(v)" modules/core/runtime.js
          grep -Fq '/modules/core/portal-v70.js?v=172-clean' index.html
          grep -Fq '/css/portal-v70.css?v=172-clean' index.html
          test -s modules/core/portal-v70.js
          test -s css/portal-v70.css
      - name: Commit clean routing
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html modules css tools
          git commit -m 'V172 clean: canonical Panapass routing and external V70 portal'
          git push origin HEAD:v172-clean
