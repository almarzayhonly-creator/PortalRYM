name: Deploy latest V169 test preview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v169-preview-now.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: cleanup-v168
      - name: Deploy preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@latest versions upload --preview-alias cleanup-v168
      - name: Verify published V169 markers
        shell: bash
        run: |
          URL='https://cleanup-v168-portal-ena-rym.almarzayhonly.workers.dev'
          ok=0
          for i in 1 2 3 4 5; do
            stamp="$(date +%s)"
            rm -f /tmp/preview.html /tmp/final.js /tmp/panapass.js
            if curl -fsSL --max-time 20 "$URL/?v169check=$stamp" -o /tmp/preview.html \
              && curl -fsSL --max-time 20 "$URL/v169-final-polish.js?v169check=$stamp" -o /tmp/final.js \
              && curl -fsSL --max-time 20 "$URL/panapass-v169-final.js?v169check=$stamp" -o /tmp/panapass.js; then
              if grep -Fq 'v169-session-expiry-guard' /tmp/preview.html \
                && grep -Fq 'v169-final-polish.js?v=169final' /tmp/preview.html \
                && grep -Fq 'Posiciones 4–14' /tmp/panapass.js \
                && grep -Fq 'Posiciones 15–25' /tmp/panapass.js \
                && grep -Fq 'v169-rec-r2' /tmp/final.js \
                && grep -Fq 'v169r2-head' /tmp/final.js \
                && grep -Fq 'Pagos recurrentes' /tmp/final.js \
                && grep -Fq 'panapass-baja-transferencia-pdf-v2' /tmp/final.js \
                && grep -Fq 'https://ena.com.pa/wp-content/uploads/2020/12/TRANSFERENCIA-DE-SALDO-POSITIVO.pdf' /tmp/final.js \
                && ! grep -Fq 'https://www.ena.com.pa/wp-content/uploads/2020/12/TRANSFERENCIA-DE-SALDO-POSITIVO.pdf' /tmp/final.js; then
                  ok=1
                  break
              fi
            fi
            sleep 5
          done
          test "$ok" -eq 1
          echo 'Preview verified: recurrentes redesign + refined ENA PDF endpoint.'
