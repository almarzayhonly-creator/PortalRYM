name: Test exact ranking recurrentes version
on:
  push:
    branches: [test-ranking-recurrentes-correctos]
    paths: ['.github/workflows/deploy-v169-preview-now.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-ranking-recurrentes-correctos
      - name: Verify exact version markers
        run: |
          grep -Fq 'Posiciones 4–14' panapass-v169-final.js
          grep -Fq 'Posiciones 15–25' panapass-v169-final.js
          grep -Fq 'v169-rec-r2' v169-final-polish.js
          grep -Fq 'v169r2-head' v169-final-polish.js
          grep -Fq 'Pagos recurrentes' v169-final-polish.js
      - name: Deploy exact test version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest versions upload --preview-alias ranking-recurrentes-ok
      - name: Verify published version
        run: |
          U='https://ranking-recurrentes-ok-portal-ena-rym.almarzayhonly.workers.dev'
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 "$U/panapass-v169-final.js?x=$(date +%s)" -o /tmp/r && curl -fsSL --max-time 20 "$U/v169-final-polish.js?x=$(date +%s)" -o /tmp/f && grep -Fq 'Posiciones 4–14' /tmp/r && grep -Fq 'Posiciones 15–25' /tmp/r && grep -Fq 'v169-rec-r2' /tmp/f && grep -Fq 'v169r2-head' /tmp/f; then echo "$U"; exit 0; fi
            sleep 5
          done
          exit 1
