name: V172 Control route hooks
on:
  push:
    branches: [v172-clean]
    paths:
      - 'tools/v172_control_route_hooks.mjs'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v172-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save acorn astring
      - name: Convert Control monkey patches to router hooks
        run: node tools/v172_control_route_hooks.mjs
      - name: Validate
        run: |
          node --check modules/control-auto/router.js
          find modules/control-auto modules/panapass modules/revisados modules/core -type f -path '*/runtime/*.js' -print0 | xargs -0 -n1 node --check
          grep -Fq '__RYM_CONTROL_PENDING_AROUND__' modules/control-auto/router.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V172 clean: replace Control route overrides with router hooks'
          git push origin HEAD:v172-clean
