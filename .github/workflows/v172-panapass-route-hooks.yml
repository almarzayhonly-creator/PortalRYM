name: V172 Panapass route hooks
on:
  push:
    branches: [v172-clean]
    paths:
      - 'tools/v172_panapass_route_hooks.mjs'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v172-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install parser
        run: npm install --no-save acorn astring
      - name: Convert Panapass route monkey patches to hooks
        run: node tools/v172_panapass_route_hooks.mjs
      - name: Validate
        run: |
          node --check modules/panapass/router.js
          find modules/panapass/runtime -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          grep -Fq '__RYM_PANAPASS_PENDING_AROUND__' modules/panapass/router.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/panapass
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'V172 clean: replace Panapass route overrides with router hooks'
          git push origin HEAD:v172-clean
