name: Inspect V169 Recurrentes
on:
  push:
    branches: [cleanup-v168]
    paths: ['.github/workflows/v169-recurrentes-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find recurrentes implementation
        shell: bash
        run: |
          echo '--- recurrentes matches ---'
          grep -n -i -E 'Recurrentes|OPERADORES RECURRENTES|MÍNIMO DE PAGOS|MINIMO DE PAGOS|Por operador|Por unidad|CRÍTICOS|CRITICOS' index.html | head -160 || true
          echo '--- contexts ---'
          for n in $(grep -n -i -E 'OPERADORES RECURRENTES|MÍNIMO DE PAGOS|MINIMO DE PAGOS|Por operador' index.html | cut -d: -f1 | head -10); do
            s=$((n>45?n-45:1)); e=$((n+120)); echo "### lines $s-$e"; sed -n "${s},${e}p" index.html; done
